# The user guide as a book: the English source in docs/user, and each
# translation in docs/i18n/<lang>. Built only by scripts/site/build.sh (through
# scripts/site/guide.py), which builds from a staging copy of docs/, writes the
# generated book-assets/languages.js, passes the output directory
# (mdbook build -d) and, for a translation, overrides src, language and title.
[book]
title = "Fauste Player — User guide"
language = "en"
src = "user"

[output.html]
git-repository-url = "https://github.com/sanchezfauste/fauste-player"
# {path} is relative to docs/ (user/... or i18n/<lang>/...).
edit-url-template = "https://github.com/sanchezfauste/fauste-player/edit/master/docs/{path}"
additional-js = ["book-assets/languages.js", "book-assets/language-menu.js"]
additional-css = ["book-assets/language-menu.css"]
