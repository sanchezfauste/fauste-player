# Snap package for the Snap Store, built by the `stores` workflow
# (snapcore/action-build) on amd64 and arm64. Built from source like the
# Flatpak; the summary and description come from the AppStream metainfo,
# the version from Cargo.toml. The metainfo has no icon, so it is given here
# (the store listing takes it from the snap).
name: fauste-player
title: Fauste Player
icon: packaging/icons/fauste-player-512.png
base: core24
grade: stable
confinement: strict
license: GPL-3.0-or-later
contact: https://github.com/sanchezfauste/fauste-player/issues
issues: https://github.com/sanchezfauste/fauste-player/issues
source-code: https://github.com/sanchezfauste/fauste-player
website: https://sanchezfauste.com/fauste-player/
adopt-info: fauste-player

platforms:
  amd64:
  arm64:

apps:
  fauste-player:
    command: bin/fauste-player
    common-id: com.sanchezfauste.FaustePlayer
    desktop: usr/share/applications/com.sanchezfauste.FaustePlayer.desktop
    # Window system libraries, Mesa and the desktop portals.
    extensions: [gnome]
    plugs:
      # Through the PulseAudio protocol (PipeWire's pulse service too).
      - audio-playback
      # ALSA hw: devices for bit-perfect output, and MIDI control surfaces.
      # Not connected automatically: `snap connect fauste-player:alsa`.
      - alsa
      # Music libraries read in place.
      - home
      - removable-media
      # The remote control API and OSC.
      - network
      - network-bind

parts:
  # The toolchain rust-toolchain.toml pins, which the rust plugin then uses
  # (a part with this name replaces the plugin's own rustup set-up).
  # rustup-init is pinned and checked before it runs.
  rust-deps:
    plugin: nil
    source: .
    build-packages: [curl]
    override-build: |
      rustup_version=1.29.2
      case "$(uname -m)" in
        x86_64) sha=5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4 ;;
        aarch64) sha=a9c168dbea81a84671c6b7a5c1795cb0eb699020110d107ddfca427bd797e697 ;;
        *) echo "no rustup-init pin for $(uname -m)" >&2; exit 1 ;;
      esac
      curl --proto '=https' --tlsv1.2 -sSf -o rustup-init \
        "https://static.rust-lang.org/rustup/archive/${rustup_version}/$(uname -m)-unknown-linux-gnu/rustup-init"
      echo "${sha}  rustup-init" | sha256sum -c --quiet -
      chmod +x rustup-init
      channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
      ./rustup-init -y --profile minimal --default-toolchain "${channel}"

  fauste-player:
    after: [rust-deps]
    plugin: rust
    source: .
    rust-path: [crates/fp-app]
    # Use the rust-deps toolchain, never the plugin's own rustup.
    rust-channel: none
    build-packages:
      - pkg-config
      - libasound2-dev
      - libdbus-1-dev
    stage-packages:
      - libasound2t64
      - libdbus-1-3
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
    override-build: |
      # The rust plugin runs `cargo install --locked` into bin/.
      craftctl default
      app=com.sanchezfauste.FaustePlayer
      version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
      share="${CRAFT_PART_INSTALL}/usr/share"
      install -Dm644 packaging/linux/${app}.desktop "${share}/applications/${app}.desktop"
      # A themed icon name does not resolve inside the snap: point at the file.
      sed -i "s|^Icon=.*|Icon=\${SNAP}/usr/share/icons/hicolor/512x512/apps/${app}.png|" \
        "${share}/applications/${app}.desktop"
      mkdir -p "${share}/metainfo"
      scripts/package/metainfo.sh "${version}" "${share}/metainfo/${app}.metainfo.xml"
      install -Dm644 packaging/icons/fauste-player.svg "${share}/icons/hicolor/scalable/apps/${app}.svg"
      for n in 16 32 48 64 128 256 512; do
        install -Dm644 packaging/icons/fauste-player-$n.png "${share}/icons/hicolor/${n}x${n}/apps/${app}.png"
      done
      # Where the About window looks for the notices (next to bin/).
      licenses="${CRAFT_PART_INSTALL}/share/licenses/${app}"
      install -Dm644 LICENSE "${licenses}/LICENSE"
      install -Dm644 NOTICE "${licenses}/NOTICE"
      install -Dm644 crates/fp-app/assets/fonts/OFL.txt "${licenses}/Inter-OFL.txt"
      install -Dm644 crates/fp-app/assets/licenses/Phosphor-MIT.txt "${licenses}/Phosphor-MIT.txt"
      PATH="${HOME}/.cargo/bin:${PATH}" scripts/package/notices.sh "${licenses}/THIRD-PARTY.html"
    parse-info: [usr/share/metainfo/com.sanchezfauste.FaustePlayer.metainfo.xml]
