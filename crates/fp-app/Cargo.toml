[package]
name = "fp-app"
description = "Radio playout with several players and a cartwall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fauste-player"
path = "src/main.rs"

[dependencies]
fp-model.workspace = true
fp-store.workspace = true
fp-engine.workspace = true
fp-backends.workspace = true
fp-analysis.workspace = true
arc-swap.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui-phosphor.workspace = true
rfd.workspace = true
pollster.workspace = true
chrono.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
sys-locale.workspace = true
image.workspace = true

[features]
default = []
# Audio systems (see crates/fp-backends/Cargo.toml).
pipewire = ["fp-backends/pipewire"]
jack = ["fp-backends/jack"]
asio = ["fp-backends/asio"]
# Hooks that inject failures, for the integration tests only.
test-hooks = []

[dev-dependencies]
fp-app = { path = ".", features = ["test-hooks"] }
egui_kittest.workspace = true
tempfile.workspace = true
hound.workspace = true

[lints]
workspace = true

# Linux packages (Phase 5). `scripts/package/linux.sh` stages
# `dist/staging/` (versioned metainfo, notices) before these run.
[package.metadata.deb]
name = "fauste-player"
maintainer = "Marc Sánchez Fauste <sanchezfauste@gmail.com>"
copyright = "Marc Sánchez Fauste"
extended-description = """\
Radio playout: several independent players with sample-accurate mixing, \
automatic cue and MIX markers, CUE pre-listen, a cartwall of instant carts \
and bit-perfect output on exclusive devices."""
section = "sound"
priority = "optional"
depends = "$auto"
recommends = "pipewire-pulse | pulseaudio"
assets = [
    ["target/release/fauste-player", "usr/bin/", "755"],
    ["../../packaging/linux/org.fauste.FaustePlayer.desktop", "usr/share/applications/", "644"],
    ["../../dist/staging/org.fauste.FaustePlayer.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../packaging/icons/fauste-player.svg", "usr/share/icons/hicolor/scalable/apps/org.fauste.FaustePlayer.svg", "644"],
    ["../../packaging/icons/fauste-player-16.png", "usr/share/icons/hicolor/16x16/apps/org.fauste.FaustePlayer.png", "644"],
    ["../../packaging/icons/fauste-player-32.png", "usr/share/icons/hicolor/32x32/apps/org.fauste.FaustePlayer.png", "644"],
    ["../../packaging/icons/fauste-player-48.png", "usr/share/icons/hicolor/48x48/apps/org.fauste.FaustePlayer.png", "644"],
    ["../../packaging/icons/fauste-player-64.png", "usr/share/icons/hicolor/64x64/apps/org.fauste.FaustePlayer.png", "644"],
    ["../../packaging/icons/fauste-player-128.png", "usr/share/icons/hicolor/128x128/apps/org.fauste.FaustePlayer.png", "644"],
    ["../../packaging/icons/fauste-player-256.png", "usr/share/icons/hicolor/256x256/apps/org.fauste.FaustePlayer.png", "644"],
    ["../../packaging/icons/fauste-player-512.png", "usr/share/icons/hicolor/512x512/apps/org.fauste.FaustePlayer.png", "644"],
    ["../../README.md", "usr/share/doc/fauste-player/", "644"],
    ["../../dist/staging/THIRD-PARTY.html", "usr/share/doc/fauste-player/", "644"],
    ["assets/fonts/OFL.txt", "usr/share/doc/fauste-player/Inter-OFL.txt", "644"],
]

[package.metadata.generate-rpm]
name = "fauste-player"
summary = "Radio playout with several players and a cartwall"
license = "LicenseRef-proprietary"
url = "https://github.com/sanchezfauste/fauste-player"
assets = [
    { source = "target/release/fauste-player", dest = "/usr/bin/fauste-player", mode = "755" },
    { source = "../../packaging/linux/org.fauste.FaustePlayer.desktop", dest = "/usr/share/applications/org.fauste.FaustePlayer.desktop", mode = "644" },
    { source = "../../dist/staging/org.fauste.FaustePlayer.metainfo.xml", dest = "/usr/share/metainfo/org.fauste.FaustePlayer.metainfo.xml", mode = "644" },
    { source = "../../packaging/icons/fauste-player.svg", dest = "/usr/share/icons/hicolor/scalable/apps/org.fauste.FaustePlayer.svg", mode = "644" },
    { source = "../../packaging/icons/fauste-player-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/org.fauste.FaustePlayer.png", mode = "644" },
    { source = "../../packaging/icons/fauste-player-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/org.fauste.FaustePlayer.png", mode = "644" },
    { source = "../../packaging/icons/fauste-player-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/org.fauste.FaustePlayer.png", mode = "644" },
    { source = "../../packaging/icons/fauste-player-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/org.fauste.FaustePlayer.png", mode = "644" },
    { source = "../../packaging/icons/fauste-player-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/org.fauste.FaustePlayer.png", mode = "644" },
    { source = "../../packaging/icons/fauste-player-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/org.fauste.FaustePlayer.png", mode = "644" },
    { source = "../../packaging/icons/fauste-player-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/org.fauste.FaustePlayer.png", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/fauste-player/README.md", mode = "644", doc = true },
    { source = "../../dist/staging/THIRD-PARTY.html", dest = "/usr/share/doc/fauste-player/THIRD-PARTY.html", mode = "644", doc = true },
    { source = "assets/fonts/OFL.txt", dest = "/usr/share/doc/fauste-player/Inter-OFL.txt", mode = "644", doc = true },
]

[package.metadata.generate-rpm.recommends]
pipewire-pulseaudio = "*"
