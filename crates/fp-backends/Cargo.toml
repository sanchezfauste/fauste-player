[package]
name = "fp-backends"
description = "Audio output backends behind one trait (Null, Offline, cpal)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
cpal.workspace = true
rtrb.workspace = true

[features]
default = ["pulseaudio"]
# Audio systems beyond the platform default (Phase 3). Each is a cpal host.
# pulseaudio: a pure-Rust client, no system library needed (Linux).
pulseaudio = ["cpal/pulseaudio"]
# pipewire: needs libpipewire-0.3-dev, libspa-0.2-dev and clang to build (Linux).
pipewire = ["cpal/pipewire"]
# jack: loaded at run time; on Linux building needs libjack-dev.
jack = ["cpal/jack"]
# asio: needs the Steinberg ASIO SDK at build time (CPAL_ASIO_DIR), Windows.
asio = ["cpal/asio"]

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["realtime-dbus"] }

# Exclusive modes (Phase 4 plan 2), through safe APIs only.
[target.'cfg(windows)'.dependencies]
wasapi = "0.24.0"
crossbeam-channel.workspace = true
