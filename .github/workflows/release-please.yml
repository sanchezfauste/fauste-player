name: release-please

# On every push to master, release-please keeps a release PR up to date
# (version bump in Cargo.toml / Cargo.lock and the CHANGELOG, derived from
# Conventional Commits). Merging that PR tags vX.Y.Z and creates the GitHub
# release; the binaries are then built and attached in the same run, because
# releases created with GITHUB_TOKEN do not trigger other workflows.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
