name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libdbus-1-dev
          libpipewire-0.3-dev libspa-0.2-dev libjack-jackd2-dev clang
      - name: Choose the audio systems to build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            echo "FEATURES=fp-backends/pipewire,fp-backends/jack" >> "$GITHUB_ENV"
          else
            echo "FEATURES=fp-backends/jack" >> "$GITHUB_ENV"
          fi
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --features "$FEATURES" -- -D warnings
        shell: bash
      - run: cargo test --workspace --locked --features "$FEATURES"
        shell: bash

  release-baseline:
    name: release build on the release image
    # The Linux archives are built on ubuntu-22.04 (the oldest glibc they
    # support); this catches a dependency that needs newer system packages
    # or links a library the binary would need just to start.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libdbus-1-dev libjack-jackd2-dev
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p fp-app --bin fauste-player --features jack
      - run: scripts/check-runtime-deps.sh target/debug/fauste-player

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  release-config:
    name: release bump keeps --locked builds working
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: scripts/check-release-bump.sh

  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo +nightly check --manifest-path fuzz/Cargo.toml --bins
