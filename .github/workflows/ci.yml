name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes; every push to
# master keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libdbus-1-dev
          libpipewire-0.3-dev libspa-0.2-dev libjack-jackd2-dev clang
      - name: Choose the audio systems to build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            echo "FEATURES=fp-backends/pipewire,fp-backends/jack" >> "$GITHUB_ENV"
          else
            echo "FEATURES=fp-backends/jack" >> "$GITHUB_ENV"
          fi
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --features "$FEATURES" -- -D warnings
        shell: bash
      # The suite runs once, instrumented for test coverage (cargo-llvm-cov),
      # and the report goes to the `sonarqube` job.
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --no-report --workspace --locked --no-fail-fast --features "$FEATURES"
        shell: bash
      # Coverage is informative: a failing test still leaves a report. Its
      # paths are made relative to the repository root so the three systems'
      # reports match the same files, and hit counts are capped at the
      # largest 32-bit integer, the most SonarQube reads (a hot DSP loop runs
      # billions of times).
      - name: Write the coverage report
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          cargo llvm-cov report --lcov --output-path "lcov-$RUNNER_OS.info"
          ROOT="${GITHUB_WORKSPACE//\\//}" perl -pi -e \
            'if (/^SF:/) { s{\\}{/}g; s{^SF:\Q$ENV{ROOT}\E/}{SF:}i }
             s{^(?:DA:\d+,|FNDA:|BRDA:[^,]+,[^,]+,[^,]+,)\K(\d+)}{$1 > 2147483647 ? 2147483647 : $1}e' \
            "lcov-$RUNNER_OS.info"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: lcov-${{ runner.os }}
          path: lcov-${{ runner.os }}.info
          if-no-files-found: warn
          retention-days: 7
      # The packaging check for the Windows GUI subsystem, on the shells
      # that run it (Git Bash on the Windows release runner).
      - name: Self-test the Windows GUI subsystem check
        if: runner.os != 'macOS'
        run: scripts/check-windows-gui.sh --self-test
        shell: bash

  sonarqube:
    name: SonarQube
    # Informative only: the analysis never blocks a pull request. Pull
    # requests from forks and Dependabot get no secrets, so they skip it.
    needs: test
    if: ${{ !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for blame and new-code detection
      - uses: actions/download-artifact@v8
        with:
          pattern: lcov-*
          path: coverage
          merge-multiple: true
      - uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8

  release-baseline:
    name: release build and Linux packages on the release image
    # The Linux archives and packages are built on ubuntu-22.04 (the oldest
    # glibc they support). This builds them all as a release would, which
    # catches a dependency that needs newer system packages, a library the
    # binary would need just to start, and broken package metadata.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libdbus-1-dev libjack-jackd2-dev
          desktop-file-utils appstream
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,cargo-binstall
      - run: cargo binstall -y --locked cargo-deb cargo-generate-rpm
      - name: Validate the desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/com.sanchezfauste.FaustePlayer.desktop
          scripts/package/metainfo.sh 0.0.0 metainfo.xml
          appstreamcli validate --no-net metainfo.xml
      - name: Build the archive and the packages
        run: scripts/package/linux.sh x86_64-unknown-linux-gnu
        env:
          FEATURES: jack

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  release-config:
    name: release bump keeps --locked builds working
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: scripts/check-release-bump.sh

  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo +nightly check --manifest-path fuzz/Cargo.toml --bins
