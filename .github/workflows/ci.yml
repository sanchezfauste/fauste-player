name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes; every push to
# master keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libdbus-1-dev
          libpipewire-0.3-dev libspa-0.2-dev libjack-jackd2-dev clang
      - name: Choose the audio systems to build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            echo "FEATURES=fp-backends/pipewire,fp-backends/jack" >> "$GITHUB_ENV"
          else
            echo "FEATURES=fp-backends/jack" >> "$GITHUB_ENV"
          fi
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --features "$FEATURES" -- -D warnings
        shell: bash
      - run: cargo test --workspace --locked --no-fail-fast --features "$FEATURES"
        shell: bash
      # The packaging check for the Windows GUI subsystem, on the shells
      # that run it (Git Bash on the Windows release runner).
      - name: Self-test the Windows GUI subsystem check
        if: runner.os != 'macOS'
        run: scripts/check-windows-gui.sh --self-test
        shell: bash

  release-baseline:
    name: release build and Linux packages on the release image
    # The Linux archives and packages are built on ubuntu-22.04 (the oldest
    # glibc they support). This builds them all as a release would, which
    # catches a dependency that needs newer system packages, a library the
    # binary would need just to start, and broken package metadata.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libdbus-1-dev libjack-jackd2-dev
          desktop-file-utils appstream
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,cargo-binstall
      - run: cargo binstall -y --locked cargo-deb cargo-generate-rpm
      - name: Validate the desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/org.fauste.FaustePlayer.desktop
          scripts/package/metainfo.sh 0.0.0 metainfo.xml
          appstreamcli validate --no-net metainfo.xml
      - name: Build the archive and the packages
        run: scripts/package/linux.sh x86_64-unknown-linux-gnu
        env:
          FEATURES: jack

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  release-config:
    name: release bump keeps --locked builds working
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: scripts/check-release-bump.sh

  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo +nightly check --manifest-path fuzz/Cargo.toml --bins
