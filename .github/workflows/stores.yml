name: stores

# Publishes a release to the app stores and package repositories:
#   - Microsoft Store: an MSIX package, submitted with the Store CLI;
#   - Snap Store: a snap for amd64 and arm64;
#   - Google Play: the release's signed Android App Bundle and the store
#     listing (texts and images of packaging/android/play);
#   - Flathub: a pull request to flathub/com.sanchezfauste.FaustePlayer with the
#     release's manifest and cargo sources (Flathub builds and publishes it);
#   - WinGet: a pull request to microsoft/winget-pkgs with the release's MSI;
#   - AUR: the fauste-player-bin package from the release's Linux archives.
# Called by release-please after the release assets are uploaded; can also be
# run by hand for an existing tag. Each store publishes only when its secrets
# are configured (see docs/technical/release-process.md, "Stores"), and
# pre-releases go only to the Snap Store's beta channel. Pull requests that
# touch the store packaging run it as a dry run: they build the MSIX and the
# snaps, lint the Flathub manifest and check the Google Play listing, and
# publish nothing.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        type: boolean
        default: false
  pull_request:
    paths:
      - snap/**
      - packaging/**
      - scripts/package/msix.sh
      - scripts/package/aur.sh
      - scripts/package/flathub-manifest.py
      - scripts/package/flatpak-cargo-sources.sh
      - scripts/package/metainfo.sh
      - scripts/package/notices.sh
      - scripts/package/play-listing.py
      - scripts/package/tests/**
      # play-listing.py check reads them: every locale has a listing, and
      # the guide's copy of the screenshots is the English one.
      - crates/fp-app/locales/**
      - docs/images/android/**
      - .github/workflows/stores.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.10.0)
        required: true
        type: string
      dry_run:
        description: Build and check without publishing anything
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels the dry run it supersedes; a release
# is never cancelled.
concurrency:
  group: stores-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: What to publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      msstore: ${{ steps.plan.outputs.publish == 'true' && steps.plan.outputs.prerelease == 'false' && secrets.MSSTORE_CLIENT_SECRET != '' && vars.MSSTORE_PRODUCT_ID != '' && vars.MSSTORE_IDENTITY_NAME != '' && vars.MSSTORE_PUBLISHER != '' }}
      snap: ${{ steps.plan.outputs.publish == 'true' && secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
      googleplay: ${{ steps.plan.outputs.publish == 'true' && steps.plan.outputs.prerelease == 'false' && secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
      flathub: ${{ steps.plan.outputs.publish == 'true' && steps.plan.outputs.prerelease == 'false' && secrets.FLATHUB_TOKEN != '' }}
      winget: ${{ steps.plan.outputs.publish == 'true' && steps.plan.outputs.prerelease == 'false' && secrets.WINGET_TOKEN != '' }}
      aur: ${{ steps.plan.outputs.publish == 'true' && steps.plan.outputs.prerelease == 'false' && secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - id: plan
        env:
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "${EVENT}" != pull_request ]; then
            # Only release tags, and only those that carry the store
            # packaging: every job builds from the tag.
            if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::${TAG} is not a release tag (vX.Y.Z)"; exit 1
            fi
            if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null; then
              echo "::error::there is no tag ${TAG}"; exit 1
            fi
            if ! curl -sfIo /dev/null "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/snap/snapcraft.yaml"; then
              echo "::error::${TAG} predates the store packaging; use a later release"; exit 1
            fi
          fi
          version="${TAG#v}"
          prerelease=false
          case "${version}" in *-*) prerelease=true ;; esac
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "publish=${PUBLISH}"
          } >> "$GITHUB_OUTPUT"

  msstore:
    name: Microsoft Store (MSIX)
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Install the pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: msix
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Build the MSIX package
        id: package
        shell: bash
        run: |
          # Assigned first: a failure of the script fails the step.
          out="$(scripts/package/msix.sh x86_64-pc-windows-msvc "${VERSION}")"
          echo "msix=$(printf '%s\n' "${out}" | tail -n1)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          FEATURES: jack
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
      - uses: actions/upload-artifact@v7
        with:
          name: msix
          # A relative path: the script prints a Git Bash one.
          path: dist/*.msix
          if-no-files-found: error
      - name: Install the Microsoft Store CLI
        if: needs.plan.outputs.msstore == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Submit to the Microsoft Store
        if: needs.plan.outputs.msstore == 'true'
        shell: bash
        run: |
          msstore reconfigure --tenantId "${TENANT_ID}" --sellerId "${SELLER_ID}" \
            --clientId "${CLIENT_ID}" --clientSecret "${CLIENT_SECRET}"
          # Uploads the package to a new submission and commits it for
          # certification; the listing stays as set in Partner Center.
          # The CLI takes a directory and picks the package in it, so the
          # MSIX goes alone into one.
          mkdir -p msstore-upload
          cp "${MSIX}" msstore-upload/
          msstore publish msstore-upload --inputDirectory msstore-upload --appId "${PRODUCT_ID}" --verbose
        env:
          MSIX: ${{ steps.package.outputs.msix }}
          PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
          TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}

  snap:
    name: Snap Store (${{ matrix.arch }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
      - name: Upload to the Snap Store
        if: needs.plan.outputs.snap == 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ needs.plan.outputs.prerelease == 'true' && 'beta' || vars.SNAP_CHANNEL || 'stable' }}
      # "Update metadata on release" refreshes only the listing's texts, never
      # its icon: upload-metadata sends the snap's summary, description, title,
      # licence and meta/gui/icon.png. Once per release (both snaps carry the
      # same metadata), and never from a pre-release. Screenshots and the
      # banner stay manual (snapcraft does not upload them).
      - name: Update the Snap Store listing
        if: needs.plan.outputs.snap == 'true' && needs.plan.outputs.prerelease != 'true' && matrix.arch == 'amd64'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          command -v snapcraft >/dev/null || sudo snap install snapcraft --classic
          snapcraft upload-metadata "${SNAP_FILE}" --force

  google-play:
    name: Google Play
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      # Tags made before the Google Play listing have nothing to upload.
      - name: Check the listing
        id: listing
        run: |
          if [ ! -f scripts/package/play-listing.py ]; then
            echo "This tag predates the Google Play listing: nothing to do"
            exit 0
          fi
          python3 -m unittest discover -s scripts/package/tests -p 'test_*.py'
          scripts/package/play-listing.py check
          echo "present=true" >> "$GITHUB_OUTPUT"
      # The bundle is the one release-build.yml signed with the release key
      # and attached to the release (the `binaries` job runs first): a
      # rebuild here would be another build of the same versionCode.
      - name: Download the release's App Bundle
        if: needs.plan.outputs.googleplay == 'true' && steps.listing.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          aab="fauste-player-${VERSION}-android.aab"
          if ! gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "${aab}" --pattern "${aab}.sha256" --dir play; then
            echo "::error::${TAG} has no ${aab}: the release was built without the Android release key"
            exit 1
          fi
          (cd play && sha256sum -c "${aab}.sha256")
          scripts/package/play-listing.py whatsnew play/whatsnew
      # Pinned by commit: the step holds the service account's key. Every
      # release goes to one track (GOOGLE_PLAY_TRACK, default internal);
      # GOOGLE_PLAY_STATUS is draft until Play has reviewed the app once,
      # since Play refuses any other status for an app never published.
      - name: Upload to Google Play
        if: needs.plan.outputs.googleplay == 'true' && steps.listing.outputs.present == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sanchezfauste.FaustePlayer
          releaseFiles: play/fauste-player-${{ needs.plan.outputs.version }}-android.aab
          releaseName: ${{ needs.plan.outputs.version }}
          track: ${{ vars.GOOGLE_PLAY_TRACK || 'internal' }}
          status: ${{ vars.GOOGLE_PLAY_STATUS || 'completed' }}
          whatsNewDirectory: play/whatsnew
      # The listing (texts, icon, feature graphic, phone screenshots) from
      # packaging/android/play, in an edit of its own after the release:
      # fastlane's supply reads that layout as it is, and
      # --sync_image_upload sends only the images that changed. The release
      # notes went with the bundle above. The play-screenshots workflow
      # keeps the screenshots current. Every gem it runs is pinned by
      # packaging/android/fastlane/Gemfile.lock and installed in a step
      # without the key; supply needs the release's track and versionCode
      # to find the release the listing goes with.
      - name: Install fastlane
        if: needs.plan.outputs.googleplay == 'true' && steps.listing.outputs.present == 'true'
        env:
          BUNDLE_GEMFILE: packaging/android/fastlane/Gemfile
          BUNDLE_DEPLOYMENT: "true"
        run: bundle install --jobs 4
      - name: Update the Google Play listing
        if: needs.plan.outputs.googleplay == 'true' && steps.listing.outputs.present == 'true'
        env:
          BUNDLE_GEMFILE: packaging/android/fastlane/Gemfile
          BUNDLE_DEPLOYMENT: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
          LC_ALL: C.UTF-8
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ vars.GOOGLE_PLAY_TRACK || 'internal' }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          code=$(scripts/package/android.sh --version-code "${VERSION}")
          bundle exec fastlane supply \
            --package_name com.sanchezfauste.FaustePlayer \
            --metadata_path packaging/android/play \
            --track "${TRACK}" \
            --version_code "${code}" \
            --skip_upload_apk true --skip_upload_aab true \
            --skip_upload_changelogs true --sync_image_upload true

  flathub:
    name: Flathub
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Write the Flathub manifest and cargo sources
        env:
          TAG: ${{ inputs.tag || 'v0.0.0-dry-run' }}
        run: |
          pip install aiohttp tomlkit pyyaml
          mkdir -p flathub-out
          scripts/package/flatpak-cargo-sources.sh flathub-out/cargo-sources.json
          scripts/package/flathub-manifest.py "${TAG}" "$(git rev-parse HEAD)" \
            flathub-out/com.sanchezfauste.FaustePlayer.yml
          scripts/package/metainfo.sh "${TAG#v}" flathub-out/com.sanchezfauste.FaustePlayer.metainfo.xml
          scripts/package/notices.sh flathub-out/THIRD-PARTY.html
      - name: Lint as Flathub does
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          # The manifest check prints a JSON report only when it finds
          # something, and exits non-zero on errors. Silence with a zero exit
          # is a clean pass; silence with a failure is a crash.
          rc=0
          report="$(flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest flathub-out/com.sanchezfauste.FaustePlayer.yml)" || rc=$?
          if [ -z "${report}" ]; then
            [ "${rc}" -eq 0 ] || { echo "::error::flatpak-builder-lint failed (exit ${rc})"; exit 1; }
          else
            printf '%s' "${report}" | python3 -c '
          import json, sys
          text = sys.stdin.read()
          try:
              report = json.loads(text)
          except ValueError:
              print(text)
              sys.exit(1)
          print(json.dumps(report, indent=2))
          sys.exit(1 if report.get("errors") else 0)'
          fi
          # The appstream check reports as text, and through its exit code.
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            appstream flathub-out/com.sanchezfauste.FaustePlayer.metainfo.xml
      - uses: actions/upload-artifact@v7
        with:
          name: flathub
          path: |
            flathub-out/com.sanchezfauste.FaustePlayer.yml
            flathub-out/cargo-sources.json
            flathub-out/THIRD-PARTY.html
          if-no-files-found: error
      - name: Open the update pull request on Flathub
        if: needs.plan.outputs.flathub == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          repo=flathub/com.sanchezfauste.FaustePlayer
          branch="update-${TAG}"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" flathub-repo
          cp flathub-out/com.sanchezfauste.FaustePlayer.yml flathub-out/cargo-sources.json \
            flathub-out/THIRD-PARTY.html flathub-repo/
          cd flathub-repo
          git add -A
          if git diff --cached --quiet; then echo "Flathub already has ${TAG}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git commit -m "Update to ${TAG}"
          git push --force origin "${branch}"
          gh pr view "${branch}" --repo "${repo}" >/dev/null 2>&1 \
            || gh pr create --repo "${repo}" --head "${branch}" --title "Update to ${TAG}" \
              --body "Release notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

  winget:
    name: WinGet
    needs: plan
    if: needs.plan.outputs.winget == 'true'
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit: the step holds a token with write access.
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: ${{ vars.WINGET_IDENTIFIER || 'SanchezFauste.FaustePlayer' }}
          release-tag: ${{ inputs.tag }}
          installers-regex: '\.msi$'
          fork-user: ${{ vars.WINGET_FORK_USER || github.repository_owner }}
          token: ${{ secrets.WINGET_TOKEN }}

  aur:
    name: AUR (fauste-player-bin)
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Write the PKGBUILD
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [ -n "${VERSION}" ] && [ "${{ needs.plan.outputs.publish }}" = true ]; then
            scripts/package/aur.sh "${VERSION}" PKGBUILD
          else
            # Dry run: the template with placeholder checksums.
            sed -e 's/@VERSION@/0.0.0/' -e 's/@SHA256_[A-Z0-9_]*@/SKIP/' packaging/aur/PKGBUILD.in > PKGBUILD
          fi
      - name: Check the PKGBUILD
        run: |
          docker run --rm -v "$PWD:/pkg" -w /pkg archlinux:base bash -c '
            pacman -Syu --noconfirm --needed namcap >/dev/null
            useradd -m builder && chown builder /pkg
            su builder -c "makepkg --printsrcinfo" > /dev/null
            # namcap always exits 0: its errors (" E: ") fail the check.
            namcap PKGBUILD | tee namcap.txt
            ! grep -q " E: " namcap.txt'
      - name: Push to the AUR
        if: needs.plan.outputs.aur == 'true'
        # Pinned by commit: the step holds the AUR key.
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: fauste-player-bin
          pkgbuild: PKGBUILD
          commit_username: ${{ vars.AUR_USERNAME || 'Marc Sánchez Fauste' }}
          commit_email: ${{ vars.AUR_EMAIL || 'sanchezfauste@gmail.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ inputs.tag }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
