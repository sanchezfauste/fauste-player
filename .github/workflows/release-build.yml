name: release-build

# Builds the release archives and installable packages for every supported
# target and uploads them to the GitHub release of `tag`:
#   - archives (.tar.gz, .zip) for every target;
#   - Linux: .deb, .rpm and AppImage (x86_64, aarch64), and a Flatpak bundle;
#   - Windows: .msi;
#   - macOS: a universal .dmg.
# Called by release-please after a release is created; can also be run by
# hand to rebuild the assets of an existing tag. Pull requests that touch the
# packaging run it as a dry run (build everything, upload nothing), so a
# broken package shows up before the release does. Signing runs only when its
# secrets are configured (see docs/technical/release-process.md).

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  pull_request:
    paths:
      - packaging/**
      - scripts/package-release.sh
      - scripts/package/**
      - .github/workflows/release-build.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag or any ref (for example v0.2.0)
        required: true
        type: string
      dry_run:
        description: Build every package without uploading (tests the pipeline before a release)
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libdbus-1-dev libjack-jackd2-dev
      - name: Install the pinned toolchain and target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,cargo-binstall
      - name: Install the packaging tools
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) cargo binstall -y --locked cargo-deb cargo-generate-rpm ;;
            Windows)
              cargo binstall -y --locked cargo-wix
              if ! command -v candle >/dev/null; then
                choco install wixtoolset --no-progress -y
                echo "C:/Program Files (x86)/WiX Toolset v3.14/bin" >> "$GITHUB_PATH"
              fi
              ;;
          esac
      - name: Build and package
        id: package
        shell: bash
        run: |
          version="${TAG#v}"
          # JACK is loaded at run time, so every archive can offer it.
          # PipeWire is left out: it would become a start-up dependency
          # (PulseAudio covers PipeWire desktops through pipewire-pulse).
          export FEATURES="jack"
          archive="$(scripts/package-release.sh "${{ matrix.target }}" "${version}" | tail -n1)"
          files=("${archive}")
          case "$RUNNER_OS" in
            Linux)
              # Through a file: a failure of the script fails the step.
              scripts/package/linux.sh "${{ matrix.target }}" "${version}" > packages.txt
              mapfile -t -O 1 files < <(grep '^/' packages.txt)
              ;;
            Windows) files+=("$(scripts/package/windows.sh "${{ matrix.target }}" "${version}" | tail -n1)") ;;
          esac
          {
            echo "files<<EOF"
            for f in "${files[@]}"; do echo "$f"; echo "$f.sha256"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - name: Upload to the release
        if: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
        shell: bash
        run: |
          # No mapfile: macOS runners ship bash 3.2.
          files=()
          while IFS= read -r f; do [ -n "$f" ] && files+=("$f"); done <<< "${FILES}"
          gh release upload "${{ inputs.tag }}" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.package.outputs.files }}

  macos-dmg:
    name: macOS disk image (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Build the app and the disk image
        id: package
        run: |
          # Assigned first: a failure of the script fails the step.
          out="$(scripts/package/macos.sh "${TAG#v}")"
          echo "dmg=$(printf '%s\n' "${out}" | tail -n1)" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Upload to the release
        if: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
        run: gh release upload "${{ inputs.tag }}" "${DMG}" "${DMG}.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.package.outputs.dmg }}

  flatpak-sources:
    name: Flatpak cargo sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate cargo-sources.json from Cargo.lock
        run: |
          pip install aiohttp tomlkit
          # A fixed commit of the generator, checked against its SHA-256.
          curl -fsSL -o flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/41c20aa10819cdb2a4f3ca171758a96d1955c018/cargo/flatpak-cargo-generator.py
          echo "0a2db6be87d75910facef28ab46d4d6460802e8419ab850d0caa6a364d26b380  flatpak-cargo-generator.py" | sha256sum -c -
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-sources
          path: packaging/flatpak/cargo-sources.json

  flatpak:
    name: Flatpak bundle (x86_64)
    needs: flatpak-sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: cargo-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fauste-player.flatpak
          manifest-path: packaging/flatpak/org.fauste.FaustePlayer.yml
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: fauste-player.flatpak

  flatpak-release:
    name: Attach the Flatpak bundle
    needs: flatpak
    if: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
      - name: Upload to the release
        run: |
          name="fauste-player-${TAG#v}-x86_64.flatpak"
          mv fauste-player.flatpak "${name}"
          sha256sum "${name}" > "${name}.sha256"
          gh release upload "${TAG}" "${name}" "${name}.sha256" --clobber --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}

  unsigned-note:
    name: Say in the release which installers are unsigned
    needs: [build, macos-dmg]
    if: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Append the note once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERT_PFX != '' }}
          MACOS_SIGNED: ${{ secrets.APPLE_CERT_P12 != '' }}
          GUIDE: https://github.com/${{ github.repository }}/blob/${{ inputs.tag }}/docs/user/getting-started.md
        run: |
          marker="<!-- unsigned-installers -->"
          body="$(gh release view "${TAG}" --json body --jq .body --repo "${GITHUB_REPOSITORY}")"
          case "${body}" in *"${marker}"*) exit 0 ;; esac
          unsigned=()
          [ "${WINDOWS_SIGNED}" = true ] || unsigned+=("the Windows installer (SmartScreen warns about an unknown publisher)")
          [ "${MACOS_SIGNED}" = true ] || unsigned+=("the macOS app (not signed or notarised: macOS asks before its first start)")
          [ "${#unsigned[@]}" -gt 0 ] || exit 0
          {
            printf '%s\n\n%s\n\n### Unsigned installers\n\n' "${body}" "${marker}"
            for item in "${unsigned[@]}"; do printf -- '- %s\n' "${item}"; done
            printf '\nHow to open them: [Getting started](%s).\n' "${GUIDE}"
          } > notes.md
          gh release edit "${TAG}" --notes-file notes.md --repo "${GITHUB_REPOSITORY}"
