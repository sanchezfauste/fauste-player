name: release-build

# Builds the release archives and installable packages for every supported
# target and uploads them to the GitHub release of `tag`:
#   - archives (.tar.gz, .zip) for every target;
#   - Linux: .deb, .rpm and AppImage (x86_64, aarch64), and a Flatpak bundle;
#   - Windows: .msi;
#   - macOS: a universal .dmg;
#   - Android: an APK and an AAB, once the release key is configured.
# Called by release-please after a release is created; can also be run by
# hand to rebuild the assets of an existing tag. Pull requests that touch the
# packaging run it as a dry run (build everything, upload nothing), so a
# broken package shows up before the release does. Signing runs only when its
# secrets are configured (see docs/technical/release-process.md).

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  pull_request:
    paths:
      - packaging/**
      - scripts/package-release.sh
      - scripts/package/**
      - .github/workflows/release-build.yml
      # Store-only files: the stores workflow tests them.
      - '!packaging/windows/msix/**'
      - '!packaging/aur/**'
      - '!scripts/package/msix.sh'
      - '!scripts/package/aur.sh'
      - '!scripts/package/flathub-manifest.py'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag or any ref (for example v0.2.0)
        required: true
        type: string
      dry_run:
        description: Build every package without uploading (tests the pipeline before a release)
        type: boolean
        default: false

permissions:
  contents: write

# A new push to a pull request cancels the dry run it supersedes; a release
# build is never cancelled.
concurrency:
  group: release-build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libdbus-1-dev libjack-jackd2-dev
      - name: Install the pinned toolchain and target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about,cargo-binstall
      - name: Install the packaging tools
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) cargo binstall -y --locked cargo-deb cargo-generate-rpm ;;
            Windows)
              cargo binstall -y --locked cargo-wix
              if ! command -v candle >/dev/null; then
                choco install wixtoolset --no-progress -y
                echo "C:/Program Files (x86)/WiX Toolset v3.14/bin" >> "$GITHUB_PATH"
              fi
              ;;
          esac
      - name: Build and package
        id: package
        shell: bash
        run: |
          version="${TAG#v}"
          # JACK is loaded at run time, so every archive can offer it.
          # PipeWire is left out: it would become a start-up dependency
          # (PulseAudio covers PipeWire desktops through pipewire-pulse).
          export FEATURES="jack"
          archive="$(scripts/package-release.sh "${{ matrix.target }}" "${version}" | tail -n1)"
          files=("${archive}")
          case "$RUNNER_OS" in
            Linux)
              # Through a file: a failure of the script fails the step.
              scripts/package/linux.sh "${{ matrix.target }}" "${version}" > packages.txt
              mapfile -t -O 1 files < <(grep '^/' packages.txt)
              ;;
            Windows) files+=("$(scripts/package/windows.sh "${{ matrix.target }}" "${version}" | tail -n1)") ;;
          esac
          {
            echo "files<<EOF"
            for f in "${files[@]}"; do echo "$f"; echo "$f.sha256"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - name: Keep the macOS binary for the universal disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/fauste-player
          retention-days: 1
      - name: Upload to the release
        if: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
        shell: bash
        run: |
          # No mapfile: macOS runners ship bash 3.2.
          files=()
          while IFS= read -r f; do [ -n "$f" ] && files+=("$f"); done <<< "${FILES}"
          gh release upload "${{ inputs.tag }}" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.package.outputs.files }}

  macos-dmg:
    name: macOS disk image (universal)
    # Joins the binaries the macOS builds made instead of compiling them
    # again. It still runs when a build failed: the script then compiles the
    # missing architecture itself.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-binary-*
          path: prebuilt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Build the app and the disk image
        id: package
        run: |
          # Assigned first: a failure of the script fails the step.
          out="$(scripts/package/macos.sh "${TAG#v}")"
          echo "dmg=$(printf '%s\n' "${out}" | tail -n1)" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
          PREBUILT_DIR: ${{ github.workspace }}/prebuilt
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Upload to the release
        if: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
        run: gh release upload "${{ inputs.tag }}" "${DMG}" "${DMG}.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.package.outputs.dmg }}

  flatpak-sources:
    name: Flatpak cargo sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate cargo-sources.json from Cargo.lock
        run: |
          pip install aiohttp tomlkit
          scripts/package/flatpak-cargo-sources.sh
      - name: Write the crates' notices
        run: scripts/package/notices.sh packaging/flatpak/THIRD-PARTY.html
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-sources
          path: |
            packaging/flatpak/cargo-sources.json
            packaging/flatpak/THIRD-PARTY.html
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle (x86_64)
    needs: flatpak-sources
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: cargo-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fauste-player.flatpak
          manifest-path: packaging/flatpak/com.sanchezfauste.FaustePlayer.yml
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: fauste-player.flatpak

  flatpak-release:
    name: Attach the Flatpak bundle
    needs: flatpak
    if: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flatpak-bundle
      - name: Upload to the release
        run: |
          name="fauste-player-${TAG#v}-x86_64.flatpak"
          mv fauste-player.flatpak "${name}"
          sha256sum "${name}" > "${name}.sha256"
          gh release upload "${TAG}" "${name}" "${name}.sha256" --clobber --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}

  android:
    name: Android APK and AAB
    # Mobile spec §7. Published only when the release key is configured
    # (ANDROID_KEYSTORE*): a debug-signed APK would install, but Android
    # would refuse to update it with a later signed one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      # Tags made before the Android release build have nothing to build.
      - name: Check that the tag builds the Android release
        id: tag
        run: |
          if grep -q -- --self-test scripts/package/android.sh 2>/dev/null; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "This tag predates the Android release build: nothing to do"
          fi
      - uses: actions/setup-java@v6
        if: ${{ steps.tag.outputs.android == 'true' }}
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the pinned toolchain and the Android targets
        if: ${{ steps.tag.outputs.android == 'true' }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.tag.outputs.android == 'true' }}
        with:
          key: android
      - uses: taiki-e/install-action@v2
        if: ${{ steps.tag.outputs.android == 'true' }}
        with:
          tool: cargo-ndk,cargo-about
      - if: ${{ steps.tag.outputs.android == 'true' }}
        run: scripts/package/android.sh --self-test
      # Only a release run sees the key (a pull request's dry run builds
      # with the debug key), and only all four secrets together: a missing
      # one fails the job instead of publishing a debug-signed APK.
      - name: Write the release key
        if: ${{ steps.tag.outputs.android == 'true' }}
        id: key
        env:
          RELEASE: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          HAS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [ "${RELEASE}" != true ] || { [ -z "${ANDROID_KEYSTORE}" ] && [ "${HAS_PASSWORD}${HAS_ALIAS}${HAS_KEY_PASSWORD}" = falsefalsefalse ]; }; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release key: the build is signed with the debug key and not published"
            exit 0
          fi
          if [ -z "${ANDROID_KEYSTORE}" ] || [ "${HAS_PASSWORD}${HAS_ALIAS}${HAS_KEY_PASSWORD}" != truetruetrue ]; then
            echo "::error::The Android release key needs all of ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD"
            exit 1
          fi
          keystore="${RUNNER_TEMP}/release.jks"
          printf '%s' "${ANDROID_KEYSTORE}" | base64 -d > "${keystore}"
          echo "path=${keystore}" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build
        if: ${{ steps.tag.outputs.android == 'true' }}
        id: package
        env:
          TAG: ${{ inputs.tag }}
          SIGNED: ${{ steps.key.outputs.signed }}
          FAUSTE_ANDROID_KEYSTORE: ${{ steps.key.outputs.path }}
          FAUSTE_ANDROID_KEYSTORE_PASSWORD: ${{ steps.key.outputs.signed == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          FAUSTE_ANDROID_KEY_ALIAS: ${{ steps.key.outputs.signed == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          FAUSTE_ANDROID_KEY_PASSWORD: ${{ steps.key.outputs.signed == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          # The NDK the CI checks use, not the runner image's default.
          ANDROID_NDK_HOME="$(ls -d "${ANDROID_HOME}"/ndk/27.* | sort -V | tail -n1)"
          export ANDROID_NDK_HOME
          # Through a file: a failure of the script fails the step.
          scripts/package/android.sh release > built.txt
          apk="$(grep '\.apk$' built.txt)"
          # The last guard: a release APK signed with the debug key is
          # never published.
          if [ "${SIGNED}" = true ]; then
            apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n1)"
            # An assignment, so a failed verification fails the step.
            certs="$("${apksigner}" verify --print-certs "${apk}")"
            if grep -q 'CN=Android Debug' <<< "${certs}"; then
              echo "::error::The release APK is signed with the debug key"
              exit 1
            fi
          fi
          version="${TAG#v}"
          version="${version:-$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)}"
          mkdir -p dist
          cp "${apk}" "dist/fauste-player-${version}-android.apk"
          cp "$(grep '\.aab$' built.txt)" "dist/fauste-player-${version}-android.aab"
          (cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done)
          ls -l dist
      - name: Remove the release key
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/release.jks"
      - name: Upload to the release
        if: ${{ github.event_name != 'pull_request' && !inputs.dry_run && steps.tag.outputs.android == 'true' && steps.key.outputs.signed == 'true' }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  unsigned-note:
    name: Say in the release which installers are unsigned
    needs: [build, macos-dmg]
    if: ${{ github.event_name != 'pull_request' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Append the note once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERT_PFX != '' }}
          # Gatekeeper opens the app only when it is signed and notarised.
          MACOS_SIGNED: ${{ secrets.APPLE_CERT_P12 != '' && secrets.APPLE_ID != '' }}
          GUIDE: https://github.com/${{ github.repository }}/blob/${{ inputs.tag }}/docs/user/getting-started.md
        run: |
          marker="<!-- unsigned-installers -->"
          body="$(gh release view "${TAG}" --json body --jq .body --repo "${GITHUB_REPOSITORY}")"
          case "${body}" in *"${marker}"*) exit 0 ;; esac
          unsigned=()
          [ "${WINDOWS_SIGNED}" = true ] || unsigned+=("the Windows installer (SmartScreen warns about an unknown publisher)")
          [ "${MACOS_SIGNED}" = true ] || unsigned+=("the macOS app (not signed or notarised: macOS asks before its first start)")
          [ "${#unsigned[@]}" -gt 0 ] || exit 0
          {
            printf '%s\n\n%s\n\n### Unsigned installers\n\n' "${body}" "${marker}"
            for item in "${unsigned[@]}"; do printf -- '- %s\n' "${item}"; done
            printf '\nHow to open them: [Getting started](%s).\n' "${GUIDE}"
          } > notes.md
          gh release edit "${TAG}" --notes-file notes.md --repo "${GITHUB_REPOSITORY}"
