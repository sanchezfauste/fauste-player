name: conventional-commits

# Pull request titles and every commit subject must follow Conventional
# Commits 1.0.0: release-please derives versions and the changelog from them.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        run: scripts/check-commits.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
