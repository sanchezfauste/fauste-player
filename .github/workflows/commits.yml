name: conventional-commits

# Pull request titles and every commit subject must follow Conventional
# Commits 1.0.0: release-please derives versions and the changelog from them.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# A new push cancels the check it supersedes. Edits have their own group: an
# edit skips the commit check, so it must not cancel one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && 'edit' || 'push' }}
  cancel-in-progress: true

jobs:
  title:
    # An edit of the description alone changes neither the title nor a commit.
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commits:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        run: scripts/check-commits.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
