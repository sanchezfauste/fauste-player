name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the release archive name or `CHANGELOG.md`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, Windows, macOS]
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio system and device
      description: For example "ALSA, USB interface" or "WASAPI, onboard".
  - type: textarea
    id: logs
    attributes:
      label: Logs and crash reports
      description: Attach the latest log file and any crash-*.txt from the log directory (see docs/user/troubleshooting.md).
