# Dependabot version updates. Titles follow Conventional Commits
# (`build(deps): bump …`, `ci(deps): bump …`), so the commit checks and
# release-please accept them.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    groups:
      # Before 1.0 a minor release may break the API, and the egui crates must
      # move together: they update in one pull request, first in this list.
      egui:
        patterns:
          - "egui*"
          - "eframe"
          - "epaint"
          - "emath"
          - "ecolor"
      # Patch releases only fix bugs, so they arrive together. Every minor and
      # major update gets its own pull request.
      cargo-patch:
        update-types:
          - patch
    ignore:
      # These crates are replaced by the patched copies in `vendor/`
      # (`[patch.crates-io]` in the workspace Cargo.toml). A newer release
      # from crates.io would no longer match the copy, so they are updated by
      # hand together with it (see `vendor/*/VENDORED.md`).
      - dependency-name: opus-decoder
      - dependency-name: symphonia-format-mkv
      # The patched Matroska reader must match the symphonia version.
      - dependency-name: symphonia
      - dependency-name: symphonia-*

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
