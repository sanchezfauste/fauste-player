[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
fp-model = { path = "crates/fp-model" }
fp-backends = { path = "crates/fp-backends" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
directories = "6.0.0"
proptest = "1.11.0"
tempfile = "3.27.0"
cpal = { version = "0.18.2", features = ["realtime"] }
symphonia = { version = "0.6.1", features = ["all"] }
rubato = "5.0.0"
audioadapter-buffers = "5.2.0"
rtrb = "0.4.0"
crossbeam-channel = "0.5.17"
arc-swap = "1.9.2"
tracing = "0.1.44"
assert_no_alloc = "1.1.2"
hound = "3.5.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Panics must unwind so that panic isolation (spec §8.5, §4.5) works.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
