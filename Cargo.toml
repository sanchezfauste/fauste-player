[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
fp-model = { path = "crates/fp-model" }
fp-backends = { path = "crates/fp-backends" }
fp-decode = { path = "crates/fp-decode" }
fp-analysis = { path = "crates/fp-analysis" }
fp-engine = { path = "crates/fp-engine" }
fp-store = { path = "crates/fp-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
directories = "6.0.0"
proptest = "1.11.0"
tempfile = "3.27.0"
cpal = { version = "0.18.2", features = ["realtime"] }
symphonia = { version = "0.6.1", features = ["all"] }
rubato = "5.0.0"
audioadapter-buffers = "5.2.0"
rtrb = "0.4.0"
crossbeam-channel = "0.5.17"
arc-swap = "1.9.2"
tracing = "0.1.44"
assert_no_alloc = "1.1.2"
hound = "3.5.1"
lofty = "0.25.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.36.2"
egui_extras = "0.36.2"
egui-phosphor = { version = "0.14.0", features = ["regular", "fill"] }
egui_kittest = "0.36.2"
rfd = "0.17.2"
pollster = "0.4.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
sys-locale = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tracing-appender = "0.2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Panics must unwind so that panic isolation (spec §8.5, §4.5) works.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
