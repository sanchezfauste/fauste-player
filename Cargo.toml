[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz", "vendor"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
fp-model = { path = "crates/fp-model" }
fp-backends = { path = "crates/fp-backends" }
fp-decode = { path = "crates/fp-decode" }
fp-analysis = { path = "crates/fp-analysis" }
fp-engine = { path = "crates/fp-engine" }
fp-store = { path = "crates/fp-store" }
fp-control = { path = "crates/fp-control" }
fp-remote = { path = "crates/fp-remote" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
directories = "6.0.0"
proptest = "1.11.0"
tempfile = "3.27.0"
cpal = { version = "0.18.2", features = ["realtime"] }
symphonia = { version = "0.6.1", features = ["all"] }
ape-decoder = "0.3.2"
opus-decoder = "0.1.1"
opus-pure = "0.2.1"
wavicle = { version = "0.1.0", default-features = false, features = ["decode"] }
rubato = "5.0.0"
audioadapter-buffers = "5.2.0"
rtrb = "0.4.0"
crossbeam-channel = "0.5.17"
arc-swap = "1.9.2"
tracing = "0.1.44"
thread-priority = "3.1.1"
assert_no_alloc = "1.1.2"
hound = "3.5.1"
lofty = "0.25.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.36.2"
egui_extras = "0.36.2"
egui-phosphor = { version = "0.14.0", features = ["regular", "fill"] }
egui_kittest = "0.36.2"
rfd = "0.17.2"
open = "5.4.4"
midir = "0.11.0"
pollster = "0.4.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
sys-locale = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tracing-appender = "0.2.5"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "macros"] }
tower = { version = "0.5.3", features = ["util", "limit"] }
tower-http = { version = "0.7.1", features = ["cors", "timeout", "limit"] }
http-body-util = "0.1.5"
rosc = "0.11.4"
getrandom = "0.3.4"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
winit = { version = "0.30", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Panics must unwind so that panic isolation (spec §8.5, §4.5) works.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

# `opus-decoder` 0.1.1 computes its CELT FFT as an O(n²) DFT: 5.5 ms per
# 20 ms packet. The vendored copy replaces it with a mixed-radix FFT, still
# without `unsafe` (see vendor/opus-decoder/VENDORED.md).
[patch.crates-io]
opus-decoder = { path = "vendor/opus-decoder" }

