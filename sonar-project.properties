# SonarQube Cloud analysis (informative only: it never blocks a pull
# request). The workflow is the `sonarqube` job in .github/workflows/ci.yml.
sonar.projectKey=sanchezfauste_fauste-player
sonar.organization=sanchezfauste
sonar.projectName=Fauste Player
sonar.sourceEncoding=UTF-8

# The crates are the code; their integration tests are test code.
# `vendor/`, `fuzz/`, `target/`, the fonts in `assets/` and the binary
# test fixtures stay out of the analysis.
sonar.sources=crates
sonar.tests=crates
sonar.test.inclusions=crates/*/tests/**
sonar.test.exclusions=crates/*/tests/fixtures/**
sonar.exclusions=crates/*/tests/**,crates/*/assets/**

# Examples are local tools, never run by the test suite.
sonar.coverage.exclusions=crates/*/examples/**

# Test coverage from `cargo llvm-cov` on Linux, Windows and macOS, with
# paths relative to the repository root. SonarQube merges the three.
sonar.rust.lcov.reportPaths=coverage/lcov-Linux.info,coverage/lcov-Windows.info,coverage/lcov-macOS.info
