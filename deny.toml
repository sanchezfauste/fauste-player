[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is unmaintained but finished: a build-time proc-macro pulled in by
  # lofty, with no runtime code in the binary. Revisit when lofty drops it.
  { id = "RUSTSEC-2024-0436", reason = "build-time only proc-macro via lofty" },
  # `ttf-parser` is unmaintained, an informational notice (no vulnerability).
  # It parses the font of the Wayland title bar, through winit's sctk-adwaita
  # (ab_glyph), on Linux only. Revisit when sctk-adwaita moves to another parser.
  { id = "RUSTSEC-2026-0192", reason = "unmaintained notice; title-bar font via winit's sctk-adwaita" },
  # `zvariant`, `zvariant_derive` and `zbus_names` are unmaintained notices
  # (no vulnerability): they were merged into `zbus` 6. They come only
  # through eframe's accessibility on Linux (accesskit_unix, atspi); there is
  # no upgrade until accesskit moves to zbus 6. Revisit with each egui update.
  { id = "RUSTSEC-2026-0370", reason = "unmaintained notice; zvariant via eframe's accesskit (atspi) on Linux" },
  { id = "RUSTSEC-2026-0371", reason = "unmaintained notice; zbus_names via eframe's accesskit (atspi) on Linux" },
  { id = "RUSTSEC-2026-0372", reason = "unmaintained notice; zvariant_derive via eframe's accesskit (atspi) on Linux" },
  # `chrono` is an unmaintained notice (no vulnerability). The model, the
  # schedule and the as-run log use its dates and times throughout, and
  # many dependencies pull it in too. Moving to another date crate is a
  # migration of its own. Revisit then, or when a vulnerability appears.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained notice; chrono is the workspace's date and time type" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "OFL-1.1",
  "BSD-1-Clause", "BSL-1.0", "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# `notify` (file-system watching of the library's watched folders) is CC0-1.0,
# which grants no patent licence: allowed for that crate alone, never globally.
[[licenses.exceptions]]
crate = "notify"
allow = ["CC0-1.0"]
