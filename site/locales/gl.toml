[index]
title = "Fauste Player — emisión de radio para Linux, Windows e macOS"
description = "Fauste Player é unha aplicación de escritorio de emisión (playout) para radio escrita en Rust: reprodutores independentes, mesturas con precisión de mostra, preescoita CUE, cartucheira, saída bit-perfect e DSD, control MIDI e remoto."
pitch = "Emisión de radio para Linux, Windows e macOS. Reprodutores independentes, mesturas solapadas con precisión de mostra, unha saída de preescoita á parte e un motor de audio que a interface nunca pode bloquear."
cta-download = "Descargar"
cta-guide = "Ler a guía da persoa usuaria"
shot-alt = "A pantalla principal de Fauste Player: catro reprodutores con formas de onda e listas, e a cartucheira."
features = "Que fai"
players-title = "Reprodutores independentes"
players = "Catro por defecto, tantos como queiras configurar. Cada un ten as súas propias listas, transporte, conta atrás, medidor e saídas."
mixing-title = "Mestura con precisión de mostra"
mixing = "En modo continuo, a pista seguinte comeza xusto no punto MIX e sóbrepónse ao final que se esvaece da actual. Os marcadores atópanse automaticamente e pódense editar sobre a forma de onda."
cue-title = "Preescoita CUE"
cue = "Escoita calquera pista noutro dispositivo ou par de canles antes de que saia ao aire, e cárgaa como a seguinte."
cartwall-title = "Cartucheira"
cartwall = "Páxinas de cartuchos instantáneos para sintonías, efectos e cuñas, con bucles, cartuchos exclusivos e as súas propias saídas Main e Cue."
bit-perfect-title = "Bit-perfect e DSD"
bit-perfect = "O acceso exclusivo segue a frecuencia de mostraxe de cada ficheiro; as pistas DSD chegan intactas ao conversor como DoP ou DSD nativo."
control-title = "Control MIDI e remoto"
control = "Asigna os reprodutores a un controlador MIDI por aprendizaxe, ou manexa todo pola rede cunha API HTTP/JSON, eventos en directo e OSC."
survive-title = "Feito para aguantar"
survive = "Un dispositivo perdido reconéctase só, os gardados son atómicos e con copias de seguranza, e despois dunha falla nada sae ao aire por si só."
languages-title = "Once idiomas"
languages = "A interface segue o idioma do sistema operativo, ou o que escollas en Axustes. Todos os idiomas, inglés e español incluídos, fixéronse con IA e poden conter erros, así que as correccións son benvidas."
