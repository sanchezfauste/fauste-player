[privacy]
title = "Política de privacidade — Fauste Player"
description = "Fauste Player non recolle datos persoais, non envía telemetría e non abre conexións de rede pola súa conta."
heading = "Política de privacidade"
updated = "Última actualización: 24 de outubro de 2026. Esta política cobre a aplicación de escritorio Fauste Player en todas as súas distribucións: Microsoft Store, Snap Store, os paquetes da páxina de versións de GitHub e as compilacións desde o código fonte."
no-data-heading = "Non se recolle ningún dato"
no-data = "Fauste Player non recolle datos persoais. Non ten contas, nin analítica, nin publicidade, nin telemetría, e nunca envía nada sobre ti, o teu ordenador ou a túa música ao autor nin a ninguén máis."
local-heading = "O que queda no teu ordenador"
local-before = "Para funcionar, a aplicación garda estes ficheiros nos seus propios cartafoles do teu ordenador (consulta"
local-link = "Datos e copias de seguranza"
local-after = "na guía da persoa usuaria para saber onde están):"
local-settings = "os teus axustes, listas, páxinas de cartuchos e sesión;"
local-cache = "unha caché de análise coas etiquetas, os marcadores, a sonoridade e a forma de onda dos ficheiros de audio que cargas;"
local-logs = "ficheiros de rexistro e informes de fallas, que poden conter rutas de ficheiros e nomes de dispositivos."
local-leave = "Estes ficheiros nunca saen do teu ordenador agás que decidas compartilos, por exemplo anexando un rexistro a un informe de erro. Podes borralos cando queiras; desinstalar a aplicación, ou borrar os seus cartafoles, elimínaos."
network-heading = "Rede"
network = "A aplicación non abre conexións de rede saíntes pola súa conta. O control remoto opcional (unha API HTTP/JSON e OSC) está desactivado por defecto. Cando o activas en Axustes, escoita conexións dos clientes que permitas: respóndelles e envía actualizacións en directo só aos clientes que as piden. Pode protexerse cun token e listas de orixes permitidas. As ligazóns da aplicación, como a guía da persoa usuaria ou a licenza, ábrense no teu navegador web, e entón aplícase a súa propia política de privacidade."
stores-heading = "Distribución en tendas"
stores = "As tendas que distribúen Fauste Player (por exemplo Microsoft Store ou Snap Store) poden recoller datos sobre descargas, instalacións e fallas segundo as súas propias políticas de privacidade. O autor non ten control sobre eses datos."
changes-heading = "Cambios e contacto"
changes = "Se esta política cambia, a nova versión publícase nesta páxina cunha nova data. Podes preguntar no <a href=\"https://github.com/sanchezfauste/fauste-player/issues\">xestor de incidencias</a> ou escribir ao autor, Marc Sánchez Fauste, a través de <a href=\"https://sanchezfauste.com/\">sanchezfauste.com</a>."
