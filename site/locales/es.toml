[privacy]
title = "Política de privacidad — Fauste Player"
description = "Fauste Player no recoge datos personales, no envía telemetría y no abre conexiones de red por su cuenta."
heading = "Política de privacidad"
updated = "Última actualización: 24 de octubre de 2026. Esta política cubre la aplicación de escritorio Fauste Player en todas sus distribuciones: Microsoft Store, Snap Store, los paquetes de la página de versiones de GitHub y las compilaciones desde el código fuente."
no-data-heading = "No se recoge ningún dato"
no-data = "Fauste Player no recoge datos personales. No tiene cuentas, ni analítica, ni publicidad, ni telemetría, y nunca envía nada sobre ti, tu ordenador o tu música al autor ni a nadie más."
local-heading = "Lo que se queda en tu ordenador"
local-before = "Para funcionar, la aplicación guarda estos archivos en sus propias carpetas de tu ordenador (consulta"
local-link = "Datos y copias de seguridad"
local-after = "en la guía del usuario para saber dónde están):"
local-settings = "tus ajustes, listas, páginas de cartuchos y sesión;"
local-cache = "una caché de análisis con las etiquetas, los marcadores, la sonoridad y la forma de onda de los archivos de audio que cargas;"
local-logs = "archivos de registro e informes de fallos, que pueden contener rutas de archivos y nombres de dispositivos."
local-leave = "Estos archivos nunca salen de tu ordenador a menos que decidas compartirlos, por ejemplo adjuntando un registro a un informe de error. Puedes borrarlos cuando quieras; desinstalar la aplicación, o borrar sus carpetas, los elimina."
network-heading = "Red"
network = "La aplicación no abre conexiones de red salientes por su cuenta. El control remoto opcional (una API HTTP/JSON y OSC) está desactivado por defecto. Cuando lo activas en Ajustes, escucha conexiones de los clientes que permitas: les responde y envía actualizaciones en directo solo a los clientes que las piden. Puede protegerse con un token y listas de orígenes permitidos. Los enlaces de la aplicación, como la guía del usuario o la licencia, se abren en tu navegador web, y entonces se aplica su propia política de privacidad."
stores-heading = "Distribución en tiendas"
stores = "Las tiendas que distribuyen Fauste Player (por ejemplo Microsoft Store o Snap Store) pueden recoger datos sobre descargas, instalaciones y fallos según sus propias políticas de privacidad. El autor no tiene control sobre esos datos."
changes-heading = "Cambios y contacto"
changes = "Si esta política cambia, la nueva versión se publica en esta página con una nueva fecha. Puedes preguntar en el <a href=\"https://github.com/sanchezfauste/fauste-player/issues\">gestor de incidencias</a> o escribir al autor, Marc Sánchez Fauste, a través de <a href=\"https://sanchezfauste.com/\">sanchezfauste.com</a>."
