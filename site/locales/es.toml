[index]
title = "Fauste Player — emisión de radio para Linux, Windows y macOS"
description = "Fauste Player es una aplicación de escritorio de emisión (playout) para radio escrita en Rust: players independientes, mezclas con precisión de muestra, preescucha CUE, cartuchera, salida bit-perfect y DSD, control MIDI y remoto."
pitch = "Emisión de radio para Linux, Windows y macOS. Players independientes, mezclas solapadas con precisión de muestra, una salida de preescucha aparte y un motor de audio que la interfaz nunca puede bloquear."
cta-download = "Descargar"
cta-guide = "Leer la guía del usuario"
shot-alt = "La pantalla principal de Fauste Player: cuatro players con formas de onda y listas, y la cartuchera."
features = "Qué hace"
players-title = "Players independientes"
players = "Cuatro por defecto, tantos como quieras configurar. Cada uno tiene sus propias listas, transporte, cuenta atrás, medidor y salidas."
mixing-title = "Mezcla con precisión de muestra"
mixing = "En modo continuo, la pista siguiente empieza justo en el punto MIX y se solapa con el final que se desvanece de la actual. Los marcadores se detectan automáticamente y se pueden editar sobre la forma de onda."
cue-title = "Preescucha CUE"
cue = "Escucha cualquier pista en otro dispositivo o par de canales antes de que salga al aire, y cárgala como la siguiente."
cartwall-title = "Cartuchera"
cartwall = "Páginas de cartuchos instantáneos para sintonías, efectos y cuñas, con bucles, cartuchos exclusivos y sus propias salidas Main y Cue."
bit-perfect-title = "Bit-perfect y DSD"
bit-perfect = "El acceso exclusivo sigue la frecuencia de muestreo de cada archivo; las pistas DSD llegan intactas al convertidor como DoP o DSD nativo."
control-title = "Control MIDI y remoto"
control = "Asigna los players a un controlador MIDI por aprendizaje, o maneja todo por la red con una API HTTP/JSON, eventos en directo y OSC."
survive-title = "Hecho para aguantar"
survive = "Un dispositivo perdido se reconecta solo, los guardados son atómicos y con copias de seguridad, y tras un fallo nada sale al aire por sí solo."
languages-title = "Once idiomas"
languages = "La interfaz sigue el idioma del sistema operativo, o el que elijas en Ajustes. Todos los idiomas, inglés y español incluidos, se han hecho con IA y pueden contener errores, así que las correcciones son bienvenidas."
