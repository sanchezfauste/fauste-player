[privacy]
title = "Datenschutzerklärung — Fauste Player"
description = "Fauste Player erhebt keine personenbezogenen Daten, sendet keine Telemetrie und baut von sich aus keine Netzwerkverbindungen auf."
heading = "Datenschutzerklärung"
updated = "Zuletzt aktualisiert: 24. Oktober 2026. Diese Erklärung gilt für die Desktop-Anwendung Fauste Player in jeder Distribution: Microsoft Store, Snap Store, die Pakete auf der GitHub-Release-Seite und Builds aus dem Quellcode."
no-data-heading = "Es werden keine Daten erhoben"
no-data = "Fauste Player erhebt keine personenbezogenen Daten. Es gibt keine Konten, keine Analyse, keine Werbung und keine Telemetrie, und es sendet niemals etwas über dich, deinen Computer oder deine Musik an den Autor oder an sonst jemanden."
local-heading = "Was auf deinem Computer bleibt"
local-before = "Um zu funktionieren, legt die Anwendung diese Dateien in eigenen Ordnern auf deinem Computer ab (wo sie liegen, steht unter"
local-link = "Daten und Backups"
local-after = "im Benutzerhandbuch):"
local-settings = "deine Einstellungen, Playlists, Cart-Seiten und Sitzung;"
local-cache = "einen Analyse-Cache mit Tags, Markern, Lautheit und Wellenform der geladenen Audiodateien;"
local-logs = "Protokolldateien und Absturzberichte, die Dateipfade und Gerätenamen enthalten können."
local-leave = "Diese Dateien verlassen deinen Computer nie, außer du teilst sie selbst, etwa indem du ein Protokoll an einen Fehlerbericht anhängst. Du kannst sie jederzeit löschen; die Deinstallation der Anwendung oder das Löschen ihrer Ordner entfernt sie."
network-heading = "Netzwerk"
network = "Die Anwendung baut von sich aus keine ausgehenden Netzwerkverbindungen auf. Die optionale Fernsteuerung (eine HTTP/JSON-API und OSC) ist standardmäßig aus. Schaltest du sie in den Einstellungen ein, wartet sie auf Verbindungen der Clients, die du zulässt: Sie antwortet ihnen und sendet Live-Aktualisierungen nur an Clients, die sie anfordern. Sie lässt sich mit einem Token und Listen erlaubter Quellen schützen. Links in der Anwendung, etwa zum Benutzerhandbuch oder zur Lizenz, öffnen sich in deinem Webbrowser, für den dann dessen eigene Datenschutzerklärung gilt."
stores-heading = "Vertrieb über Stores"
stores = "Die Stores, die Fauste Player vertreiben (zum Beispiel der Microsoft Store oder der Snap Store), können nach ihren eigenen Datenschutzerklärungen Daten über Downloads, Installationen und Abstürze erheben. Der Autor hat keinen Einfluss auf diese Daten."
changes-heading = "Änderungen und Kontakt"
changes = "Ändert sich diese Erklärung, wird die neue Fassung mit neuem Datum auf dieser Seite veröffentlicht. Fragen kannst du im <a href=\"https://github.com/sanchezfauste/fauste-player/issues\">Issue-Tracker</a> stellen oder dem Autor, Marc Sánchez Fauste, über <a href=\"https://sanchezfauste.com/\">sanchezfauste.com</a> schreiben."
