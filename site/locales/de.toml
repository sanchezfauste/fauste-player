[index]
title = "Fauste Player — Radio-Playout für Linux, Windows und macOS"
description = "Fauste Player ist eine in Rust geschriebene Playout-Anwendung für Radiostudios: unabhängige Player, samplegenaue Übergänge, CUE-Vorhören, ein Cartwall, Bit-perfect- und DSD-Ausgabe, MIDI- und Fernsteuerung."
pitch = "Radio-Playout für Linux, Windows und macOS. Unabhängige Player, samplegenau überlappende Übergänge, ein eigener Vorhörausgang und eine Audio-Engine, die die Oberfläche niemals blockieren kann."
cta-download = "Herunterladen"
cta-guide = "Benutzerhandbuch lesen"
shot-alt = "Der Hauptbildschirm von Fauste Player: vier Player mit Wellenformen und Playlists sowie der Cartwall."
features = "Was es kann"
players-title = "Unabhängige Player"
players = "Standardmäßig vier, beliebig viele konfigurierbar. Jeder hat eigene Playlists, Transport, Countdown, Pegelanzeige und Ausgänge."
mixing-title = "Samplegenaue Übergänge"
mixing = "Im Dauerbetrieb startet der nächste Titel genau am MIX-Punkt und überlappt das ausklingende Ende des aktuellen. Marker werden automatisch gefunden und sind in der Wellenform bearbeitbar."
cue-title = "CUE-Vorhören"
cue = "Jeden Titel auf einem eigenen Gerät oder Kanalpaar vorhören, bevor er auf Sendung geht, und ihn als nächsten laden."
cartwall-title = "Cartwall"
cartwall = "Seiten mit Sofort-Carts für Jingles, Effekte und Spots, mit Loops, exklusiven Carts und eigenen Main- und Cue-Ausgängen."
automation-title = "Automation"
automation = "Ein Musikfüller, der sich aus Rotationen der Kategorien Ihrer Bibliothek selbst füllt, und ein täglicher Sendeplan mit zeitgesteuerten Blöcken für Stationskennungen, Spots und Sendungen, vom Operator gestartet und gestoppt."
bit-perfect-title = "Bit-perfect und DSD"
bit-perfect = "Der exklusive Zugriff folgt der Abtastrate jeder Datei; DSD-Titel erreichen den Wandler unverändert als DoP oder natives DSD."
control-title = "MIDI- und Fernsteuerung"
control = "Player per Lernfunktion auf einen MIDI-Controller legen oder alles über das Netzwerk steuern, mit einer HTTP/JSON-API, Live-Ereignissen und OSC."
survive-title = "Gebaut zum Durchhalten"
survive = "Ein verlorenes Gerät verbindet sich von selbst wieder, Speichervorgänge sind atomar und mit Backups, und nach einem Absturz geht nichts von allein auf Sendung."
