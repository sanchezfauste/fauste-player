# The texts of the landing page (site/index.html) and the privacy policy
# (site/privacy.html): the only source. Every other file in this folder is a
# translation into a language of the user guide, and a pull request that
# changes a text here updates all of them, with the [source-hash] that
# `python3 scripts/site/landing.py hash` prints. Values may contain inline
# HTML; they never contain {{ placeholders }}. A link split into
# -before, -link and -after lets a translation reorder the sentence.
language = "en"
name = "English"
label = "Language"

