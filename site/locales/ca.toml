[privacy]
title = "Política de privadesa — Fauste Player"
description = "Fauste Player no recull dades personals, no envia telemetria i no obre connexions de xarxa pel seu compte."
heading = "Política de privadesa"
updated = "Darrera actualització: 24 d'octubre de 2026. Aquesta política cobreix l'aplicació d'escriptori Fauste Player en totes les seves distribucions: Microsoft Store, Snap Store, els paquets de la pàgina de versions de GitHub i les compilacions des del codi font."
no-data-heading = "No es recull cap dada"
no-data = "Fauste Player no recull dades personals. No té comptes, ni analítica, ni publicitat, ni telemetria, i mai no envia res sobre tu, el teu ordinador o la teva música a l'autor ni a ningú més."
local-heading = "El que es queda al teu ordinador"
local-before = "Per funcionar, l'aplicació desa aquests fitxers a les seves pròpies carpetes del teu ordinador (consulta"
local-link = "Dades i còpies de seguretat"
local-after = "a la guia de l'usuari per saber on són):"
local-settings = "la teva configuració, llistes, pàgines de cartutxos i sessió;"
local-cache = "una memòria cau d'anàlisi amb les etiquetes, els marcadors, la sonoritat i la forma d'ona dels fitxers d'àudio que carregues;"
local-logs = "fitxers de registre i informes de fallades, que poden contenir camins de fitxers i noms de dispositius."
local-leave = "Aquests fitxers mai no surten del teu ordinador tret que decideixis compartir-los, per exemple adjuntant un registre a un informe d'error. Els pots esborrar quan vulguis; desinstal·lar l'aplicació, o esborrar les seves carpetes, els elimina."
network-heading = "Xarxa"
network = "L'aplicació no obre connexions de xarxa sortints pel seu compte. El control remot opcional (una API HTTP/JSON i OSC) està desactivat per defecte. Quan l'actives a la Configuració, escolta connexions dels clients que permetis: els respon i envia actualitzacions en directe només als clients que les demanen. Es pot protegir amb un testimoni i llistes d'orígens permesos. Els enllaços de l'aplicació, com la guia de l'usuari o la llicència, s'obren al teu navegador web, i llavors s'aplica la seva pròpia política de privadesa."
stores-heading = "Distribució a les botigues"
stores = "Les botigues que distribueixen Fauste Player (per exemple Microsoft Store o Snap Store) poden recollir dades sobre baixades, instal·lacions i fallades segons les seves pròpies polítiques de privadesa. L'autor no té cap control sobre aquestes dades."
changes-heading = "Canvis i contacte"
changes = "Si aquesta política canvia, la nova versió es publica en aquesta pàgina amb una data nova. Pots preguntar al <a href=\"https://github.com/sanchezfauste/fauste-player/issues\">gestor d'incidències</a> o escriure a l'autor, Marc Sánchez Fauste, a través de <a href=\"https://sanchezfauste.com/\">sanchezfauste.com</a>."
