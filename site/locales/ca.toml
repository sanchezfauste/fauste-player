description = "Fauste Player és una aplicació d'escriptori d'emissió (playout) per a ràdio escrita en Rust: reproductors independents, mescles amb precisió de mostra, preescolta CUE, cartutxera, sortida bit-perfect i DSD, control MIDI i remot."
pitch = "Emissió de ràdio per a Linux, Windows i macOS. Reproductors independents, mescles encavalcades amb precisió de mostra, una sortida de preescolta a part i un motor d'àudio que la interfície mai no pot bloquejar."
