mixing-title = "Mescla amb precisió de mostra"
mixing = "En mode continu, la pista següent comença exactament al punt MIX i s'encavalca amb el final que s'esvaeix de l'actual. Els marcadors es detecten automàticament i es poden editar sobre la forma d'ona."
