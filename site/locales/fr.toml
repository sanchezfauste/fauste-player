[privacy]
title = "Politique de confidentialité — Fauste Player"
description = "Fauste Player ne collecte aucune donnée personnelle, n'envoie aucune télémétrie et n'ouvre aucune connexion réseau de lui-même."
heading = "Politique de confidentialité"
updated = "Dernière mise à jour : 24 octobre 2026. Cette politique couvre l'application de bureau Fauste Player dans toutes ses distributions : le Microsoft Store, le Snap Store, les paquets de la page des versions sur GitHub et les compilations depuis les sources."
no-data-heading = "Aucune donnée n'est collectée"
no-data = "Fauste Player ne collecte aucune donnée personnelle. Il n'a ni comptes, ni statistiques, ni publicité, ni télémétrie, et n'envoie jamais rien sur vous, votre ordinateur ou votre musique à l'auteur ni à personne d'autre."
local-heading = "Ce qui reste sur votre ordinateur"
local-before = "Pour fonctionner, l'application conserve ces fichiers dans ses propres dossiers sur votre ordinateur (voir"
local-link = "Données et sauvegardes"
local-after = "dans le guide de l'utilisateur pour savoir où ils se trouvent) :"
local-settings = "vos paramètres, playlists, pages de cartouches et session ;"
local-cache = "un cache d'analyse avec les tags, marqueurs, la sonie et la forme d'onde des fichiers audio que vous chargez ;"
local-logs = "des fichiers journaux et des rapports de plantage, qui peuvent contenir des chemins de fichiers et des noms de périphériques."
local-leave = "Ces fichiers ne quittent jamais votre ordinateur sauf si vous choisissez de les partager, par exemple en joignant un journal à un rapport de bogue. Vous pouvez les supprimer à tout moment ; désinstaller l'application, ou supprimer ses dossiers, les efface."
network-heading = "Réseau"
network = "L'application n'ouvre aucune connexion réseau sortante d'elle-même. La télécommande optionnelle (une API HTTP/JSON et OSC) est désactivée par défaut. Lorsque vous l'activez dans les Paramètres, elle attend les connexions des clients que vous autorisez : elle leur répond, et n'envoie des mises à jour en direct qu'aux clients qui les demandent. Elle peut être protégée par un jeton et des listes de sources autorisées. Les liens de l'application, comme le guide de l'utilisateur ou la licence, s'ouvrent dans votre navigateur web, dont la propre politique de confidentialité s'applique alors."
stores-heading = "Distribution par les boutiques"
stores = "Les boutiques qui distribuent Fauste Player (par exemple le Microsoft Store ou le Snap Store) peuvent collecter des données sur les téléchargements, installations et plantages selon leurs propres politiques de confidentialité. L'auteur n'a aucun contrôle sur ces données."
changes-heading = "Modifications et contact"
changes = "Si cette politique change, la nouvelle version est publiée sur cette page avec une nouvelle date. Les questions peuvent être posées dans le <a href=\"https://github.com/sanchezfauste/fauste-player/issues\">suivi des tickets</a> ou en écrivant à l'auteur, Marc Sánchez Fauste, via <a href=\"https://sanchezfauste.com/\">sanchezfauste.com</a>."
