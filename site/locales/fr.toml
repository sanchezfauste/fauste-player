title = "Fauste Player — diffusion radio pour Linux, Windows et macOS"
description = "Fauste Player est une application de bureau de diffusion (playout) radio écrite en Rust : lecteurs indépendants, enchaînements précis à l'échantillon, pré-écoute CUE, mur de cartouches, sortie bit-perfect et DSD, contrôle MIDI et à distance."
pitch = "Diffusion radio pour Linux, Windows et macOS. Des lecteurs indépendants, des enchaînements superposés précis à l'échantillon, une sortie de pré-écoute séparée et un moteur audio que l'interface ne peut jamais bloquer."
cta-download = "Télécharger"
