mixing = "En mode continu, le titre suivant démarre exactement au point MIX et chevauche la fin en fondu du titre en cours. Les marqueurs sont trouvés automatiquement et modifiables sur la forme d'onde."
cue-title = "Pré-écoute CUE"
cue = "Écoutez n'importe quel titre sur un périphérique ou une paire de canaux séparés avant qu'il passe à l'antenne, et chargez-le comme le suivant."
