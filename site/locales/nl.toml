title = "Fauste Player — radio-playout voor Linux, Windows en macOS"
description = "Fauste Player is een in Rust geschreven desktop-playoutapplicatie voor radio: onafhankelijke spelers, sample-nauwkeurige mixen, CUE-voorbeluisteren, een cartwall, bit-perfect- en DSD-uitvoer, MIDI- en afstandsbediening."
pitch = "Radio-playout voor Linux, Windows en macOS. Onafhankelijke spelers, sample-nauwkeurig overlappende mixen, een aparte voorbeluisteruitgang en een audio-engine die de interface nooit kan blokkeren."
