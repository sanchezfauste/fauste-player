[privacy]
title = "Privacybeleid — Fauste Player"
description = "Fauste Player verzamelt geen persoonsgegevens, verstuurt geen telemetrie en maakt uit zichzelf geen netwerkverbindingen."
heading = "Privacybeleid"
updated = "Laatst bijgewerkt: 24 oktober 2026. Dit beleid geldt voor de desktopapplicatie Fauste Player in elke distributie: de Microsoft Store, de Snap Store, de pakketten op de GitHub-releasepagina en builds vanuit de broncode."
no-data-heading = "Er worden geen gegevens verzameld"
no-data = "Fauste Player verzamelt geen persoonsgegevens. Het heeft geen accounts, geen analyse, geen advertenties en geen telemetrie, en het stuurt nooit iets over jou, je computer of je muziek naar de auteur of naar iemand anders."
local-heading = "Wat op je computer blijft"
local-before = "Om te werken bewaart de applicatie deze bestanden in haar eigen mappen op je computer (zie"
local-link = "Gegevens en back-ups"
local-after = "in de gebruikershandleiding voor waar ze staan):"
local-settings = "je instellingen, playlists, cartpagina's en sessie;"
local-cache = "een analysecache met de tags, markers, luidheid en golfvorm van de audiobestanden die je laadt;"
local-logs = "logbestanden en crashrapporten, die bestandspaden en apparaatnamen kunnen bevatten."
local-leave = "Deze bestanden verlaten je computer nooit, tenzij je ze zelf deelt, bijvoorbeeld door een log aan een bugrapport toe te voegen. Je kunt ze altijd verwijderen; de applicatie verwijderen, of haar mappen wissen, haalt ze weg."
network-heading = "Netwerk"
network = "De applicatie maakt uit zichzelf geen uitgaande netwerkverbindingen. De optionele afstandsbediening (een HTTP/JSON-API en OSC) staat standaard uit. Als je die in Instellingen aanzet, luistert ze naar verbindingen van de clients die je toestaat: ze beantwoordt ze en stuurt live updates alleen naar clients die erom vragen. Ze kan worden beschermd met een token en lijsten van toegestane bronnen. Links in de applicatie, zoals de gebruikershandleiding of de licentie, openen in je webbrowser, waarvoor dan diens eigen privacybeleid geldt."
stores-heading = "Distributie via stores"
stores = "De stores die Fauste Player verspreiden (bijvoorbeeld de Microsoft Store of de Snap Store) kunnen volgens hun eigen privacybeleid gegevens verzamelen over downloads, installaties en crashes. De auteur heeft geen controle over die gegevens."
changes-heading = "Wijzigingen en contact"
changes = "Als dit beleid verandert, wordt de nieuwe versie met een nieuwe datum op deze pagina gepubliceerd. Vragen kun je stellen in de <a href=\"https://github.com/sanchezfauste/fauste-player/issues\">issuetracker</a> of door de auteur, Marc Sánchez Fauste, te schrijven via <a href=\"https://sanchezfauste.com/\">sanchezfauste.com</a>."
