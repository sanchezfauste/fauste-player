[index]
title = "Fauste Player — irrati-emisioa Linux, Windows eta macOSerako"
description = "Fauste Player Rust-en idatzitako irrati-emisiorako (playout) mahaigaineko aplikazio bat da: erreproduzitzaile independenteak, laginketa-zehaztasuneko nahasketak, CUE aurre-entzutea, kartutxo-panela, bit-perfect eta DSD irteera, MIDI eta urruneko kontrola."
pitch = "Irrati-emisioa Linux, Windows eta macOSerako. Erreproduzitzaile independenteak, laginketa-zehaztasunez gainjarritako nahasketak, aurre-entzuteko irteera bereizia eta interfazeak inoiz blokeatu ezin duen audio-motorra."
