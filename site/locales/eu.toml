players-title = "Erreproduzitzaile independenteak"
players = "Lau lehenespenez, nahi adina konfiguratu daitezke. Bakoitzak bere zerrendak, garraioa, atzerako kontaketa, neurgailua eta irteerak ditu."
mixing-title = "Laginketa-zehaztasuneko nahasketa"
mixing = "Modu jarraituan, hurrengo pista MIX puntuan bertan hasten da eta unekoaren amaiera desagertzen ari denarekin gainjartzen da. Markatzaileak automatikoki aurkitzen dira eta uhin-forman edita daitezke."
cue-title = "CUE aurre-entzutea"
cue = "Entzun edozein pista beste gailu edo kanal-pare batean emisiora irten aurretik, eta kargatu hurrengo gisa."
cartwall-title = "Kartutxo-panela"
cartwall = "Berehalako kartutxoen orriak sintonia, efektu eta iragarkietarako, begiztekin, kartutxo esklusiboekin eta Main eta Cue irteera propioekin."
bit-perfect-title = "Bit-perfect eta DSD"
