[privacy]
title = "Pribatutasun-politika — Fauste Player"
description = "Fauste Player-ek ez du datu pertsonalik biltzen, ez du telemetriarik bidaltzen eta ez du sare-konexiorik irekitzen bere kabuz."
heading = "Pribatutasun-politika"
updated = "Azken eguneraketa: 2026ko urriaren 24a. Politika honek Fauste Player mahaigaineko aplikazioa hartzen du bere banaketa guztietan: Microsoft Store, Snap Store, GitHub-eko bertsioen orriko paketeak eta iturburu-kodetik egindako konpilazioak."
no-data-heading = "Ez da daturik biltzen"
no-data = "Fauste Player-ek ez du datu pertsonalik biltzen. Ez du konturik, ez analitikarik, ez publizitaterik, ez telemetriarik, eta ez dio inoiz ezer bidaltzen egileari edo beste inori zuri, zure ordenagailuari edo zure musikari buruz."
local-heading = "Zure ordenagailuan geratzen dena"
local-before = "Funtzionatzeko, aplikazioak fitxategi hauek gordetzen ditu zure ordenagailuko bere karpetetan (non dauden jakiteko, ikus"
local-link = "Datuak eta babeskopiak"
local-after = "erabiltzailearen gidan):"
local-settings = "zure ezarpenak, zerrendak, kartutxo-orriak eta saioa;"
local-cache = "analisi-cache bat, kargatzen dituzun audio-fitxategien etiketekin, markatzaileekin, ozentasunarekin eta uhin-formarekin;"
local-logs = "erregistro-fitxategiak eta huts-txostenak, fitxategi-bideak eta gailu-izenak izan ditzaketenak."
local-leave = "Fitxategi hauek ez dira inoiz zure ordenagailutik irteten zuk partekatzea erabakitzen ez baduzu, adibidez erregistro bat akats-txosten bati eranstean. Nahi duzunean ezaba ditzakezu; aplikazioa desinstalatzeak, edo bere karpetak ezabatzeak, kentzen ditu."
network-heading = "Sarea"
network = "Aplikazioak ez du irteerako sare-konexiorik irekitzen bere kabuz. Aukerako urruneko kontrola (HTTP/JSON API bat eta OSC) desaktibatuta dago lehenespenez. Ezarpenetan aktibatzen duzunean, baimentzen dituzun bezeroen konexioak entzuten ditu: erantzun egiten die, eta zuzeneko eguneraketak eskatzen dituzten bezeroei bakarrik bidaltzen dizkie. Token batekin eta baimendutako jatorrien zerrendekin babes daiteke. Aplikazioko estekak, hala nola erabiltzailearen gida edo lizentzia, zure web-nabigatzailean irekitzen dira, eta orduan haren pribatutasun-politika aplikatzen da."
stores-heading = "Denden bidezko banaketa"
stores = "Fauste Player banatzen duten dendek (adibidez Microsoft Store edo Snap Store) deskargei, instalazioei eta hutsei buruzko datuak bil ditzakete beren pribatutasun-politiken arabera. Egileak ez du datu horien gaineko kontrolik."
changes-heading = "Aldaketak eta harremana"
changes = "Politika hau aldatzen bada, bertsio berria orri honetan argitaratuko da data berri batekin. Galderak <a href=\"https://github.com/sanchezfauste/fauste-player/issues\">intzidentzien kudeatzailean</a> egin daitezke, edo egileari, Marc Sánchez Fauste-ri, idatziz <a href=\"https://sanchezfauste.com/\">sanchezfauste.com</a> bidez."
