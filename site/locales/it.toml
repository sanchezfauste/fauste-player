[index]
title = "Fauste Player — playout radiofonico per Linux, Windows e macOS"
description = "Fauste Player è un'applicazione desktop di playout radiofonico scritta in Rust: lettori indipendenti, mixaggi precisi al campione, preascolto CUE, cartwall, uscita bit-perfect e DSD, controllo MIDI e remoto."
pitch = "Playout radiofonico per Linux, Windows e macOS. Lettori indipendenti, mixaggi sovrapposti precisi al campione, un'uscita di preascolto separata e un motore audio che l'interfaccia non può mai bloccare."
cta-download = "Scarica"
cta-guide = "Leggi la guida per l'utente"
shot-alt = "La schermata principale di Fauste Player: quattro lettori con forme d'onda e playlist, e il cartwall."
features = "Cosa fa"
players-title = "Lettori indipendenti"
players = "Quattro di default, quanti ne vuoi da configurazione. Ognuno ha le proprie playlist, trasporto, conto alla rovescia, misuratore e uscite."
mixing-title = "Mixaggio preciso al campione"
mixing = "In modalità continua il brano successivo parte esattamente al punto MIX e si sovrappone alla coda in dissolvenza di quello attuale. I marcatori vengono trovati automaticamente e si modificano sulla forma d'onda."
cue-title = "Preascolto CUE"
cue = "Ascolta qualsiasi brano su un dispositivo o una coppia di canali separati prima che vada in onda, e caricalo come successivo."
cartwall-title = "Cartwall"
cartwall = "Pagine di cart istantanei per jingle, effetti e spot, con loop, cart esclusivi e uscite Main e Cue proprie."
bit-perfect-title = "Bit-perfect e DSD"
bit-perfect = "L'accesso esclusivo segue la frequenza di campionamento di ogni file; i brani DSD arrivano al convertitore invariati come DoP o DSD nativo."
control-title = "Controllo MIDI e remoto"
control = "Assegna i lettori a un controller MIDI per apprendimento, oppure gestisci tutto via rete con un'API HTTP/JSON, eventi in tempo reale e OSC."
survive-title = "Fatto per resistere"
survive = "Un dispositivo perso si ricollega da solo, i salvataggi sono atomici e con backup, e dopo un crash niente va in onda da solo."
languages-title = "Undici lingue"
languages = "L'interfaccia segue la lingua del sistema operativo, o quella che scegli nelle Impostazioni. Tutte le lingue, inglese e spagnolo compresi, sono state prodotte con l'IA e possono contenere errori, quindi le correzioni sono benvenute."
