[privacy]
title = "Informativa sulla privacy — Fauste Player"
description = "Fauste Player non raccoglie dati personali, non invia telemetria e non apre connessioni di rete di propria iniziativa."
heading = "Informativa sulla privacy"
updated = "Ultimo aggiornamento: 24 ottobre 2026. Questa informativa riguarda l'applicazione desktop Fauste Player in ogni distribuzione: il Microsoft Store, lo Snap Store, i pacchetti nella pagina delle versioni su GitHub e le build dal codice sorgente."
no-data-heading = "Nessun dato viene raccolto"
no-data = "Fauste Player non raccoglie dati personali. Non ha account, analisi, pubblicità né telemetria, e non invia mai nulla su di te, sul tuo computer o sulla tua musica all'autore o a chiunque altro."
local-heading = "Cosa resta sul tuo computer"
local-before = "Per funzionare, l'applicazione conserva questi file nelle proprie cartelle sul tuo computer (vedi"
local-link = "Dati e backup"
local-after = "nella guida per l'utente per sapere dove si trovano):"
local-settings = "le tue impostazioni, playlist, pagine di cart e sessione;"
local-cache = "una cache di analisi con tag, marcatori, loudness e forma d'onda dei file audio che carichi;"
local-logs = "file di log e rapporti di crash, che possono contenere percorsi di file e nomi di dispositivi."
local-leave = "Questi file non lasciano mai il tuo computer a meno che tu non scelga di condividerli, per esempio allegando un log a una segnalazione di bug. Puoi eliminarli in qualsiasi momento; disinstallare l'applicazione, o eliminarne le cartelle, li rimuove."
network-heading = "Rete"
network = "L'applicazione non apre connessioni di rete in uscita di propria iniziativa. Il controllo remoto opzionale (un'API HTTP/JSON e OSC) è disattivato di default. Quando lo attivi nelle Impostazioni, resta in ascolto delle connessioni dei client che autorizzi: risponde loro e invia aggiornamenti in tempo reale solo ai client che li richiedono. Può essere protetto con un token e con elenchi di origini consentite. I link nell'applicazione, come la guida per l'utente o la licenza, si aprono nel tuo browser web, e si applica allora la sua informativa sulla privacy."
stores-heading = "Distribuzione negli store"
stores = "Gli store che distribuiscono Fauste Player (per esempio il Microsoft Store o lo Snap Store) possono raccogliere dati su download, installazioni e crash secondo le proprie informative sulla privacy. L'autore non ha alcun controllo su tali dati."
changes-heading = "Modifiche e contatti"
changes = "Se questa informativa cambia, la nuova versione viene pubblicata in questa pagina con una nuova data. Le domande si possono porre nell'<a href=\"https://github.com/sanchezfauste/fauste-player/issues\">issue tracker</a> o scrivendo all'autore, Marc Sánchez Fauste, tramite <a href=\"https://sanchezfauste.com/\">sanchezfauste.com</a>."
