[privacy]
title = "Polityka prywatności — Fauste Player"
description = "Fauste Player nie zbiera danych osobowych, nie wysyła telemetrii i sam z siebie nie nawiązuje połączeń sieciowych."
heading = "Polityka prywatności"
updated = "Ostatnia aktualizacja: 24 października 2026. Ta polityka obejmuje aplikację desktopową Fauste Player we wszystkich dystrybucjach: Microsoft Store, Snap Store, pakiety na stronie wydań w GitHubie i kompilacje ze źródeł."
no-data-heading = "Żadne dane nie są zbierane"
no-data = "Fauste Player nie zbiera danych osobowych. Nie ma kont, analityki, reklam ani telemetrii i nigdy nie wysyła niczego o tobie, twoim komputerze ani twojej muzyce autorowi ani nikomu innemu."
local-heading = "Co zostaje na twoim komputerze"
local-before = "Aby działać, aplikacja przechowuje te pliki we własnych folderach na twoim komputerze (gdzie się znajdują, opisuje rozdział"
local-link = "Dane i kopie zapasowe"
local-after = "w podręczniku użytkownika):"
local-settings = "twoje ustawienia, playlisty, strony cartów i sesję;"
local-cache = "pamięć podręczną analizy z tagami, znacznikami, głośnością i przebiegiem ładowanych plików audio;"
local-logs = "pliki dziennika i raporty awarii, które mogą zawierać ścieżki plików i nazwy urządzeń."
local-leave = "Te pliki nigdy nie opuszczają twojego komputera, chyba że sam zdecydujesz się je udostępnić, na przykład dołączając dziennik do zgłoszenia błędu. Możesz je usunąć w każdej chwili; odinstalowanie aplikacji lub usunięcie jej folderów je usuwa."
network-heading = "Sieć"
network = "Aplikacja sama z siebie nie otwiera wychodzących połączeń sieciowych. Opcjonalne zdalne sterowanie (API HTTP/JSON i OSC) jest domyślnie wyłączone. Gdy włączysz je w Ustawieniach, nasłuchuje połączeń od klientów, na które zezwolisz: odpowiada im i wysyła aktualizacje na żywo tylko klientom, którzy o nie proszą. Można je zabezpieczyć tokenem i listami dozwolonych źródeł. Odnośniki w aplikacji, takie jak podręcznik użytkownika czy licencja, otwierają się w twojej przeglądarce, do której stosuje się wtedy jej własna polityka prywatności."
stores-heading = "Dystrybucja przez sklepy"
stores = "Sklepy rozpowszechniające Fauste Player (na przykład Microsoft Store lub Snap Store) mogą zbierać dane o pobraniach, instalacjach i awariach zgodnie z własnymi politykami prywatności. Autor nie ma kontroli nad tymi danymi."
changes-heading = "Zmiany i kontakt"
changes = "Jeśli ta polityka się zmieni, nowa wersja zostanie opublikowana na tej stronie z nową datą. Pytania można zadawać w <a href=\"https://github.com/sanchezfauste/fauste-player/issues\">systemie zgłoszeń</a> lub pisząc do autora, Marca Sáncheza Fauste, przez <a href=\"https://sanchezfauste.com/\">sanchezfauste.com</a>."
