pitch = "Emisja radiowa dla Linuksa, Windows i macOS. Niezależne odtwarzacze, nakładające się miksy z dokładnością do próbki, osobne wyjście odsłuchu i silnik audio, którego interfejs nigdy nie zablokuje."
