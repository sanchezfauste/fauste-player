mixing-title = "Mistura com precisão de amostra"
mixing = "No modo contínuo, a faixa seguinte começa exatamente no ponto MIX e sobrepõe-se ao final em desvanecimento da atual. Os marcadores são encontrados automaticamente e podem ser editados na forma de onda."
cue-title = "Pré-escuta CUE"
cue = "Ouça qualquer faixa noutro dispositivo ou par de canais antes de ir para o ar, e carregue-a como a seguinte."
