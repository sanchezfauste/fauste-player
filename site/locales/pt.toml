title = "Fauste Player — emissão de rádio para Linux, Windows e macOS"
description = "O Fauste Player é uma aplicação de secretária de emissão (playout) de rádio escrita em Rust: leitores independentes, misturas com precisão de amostra, pré-escuta CUE, cartucheira, saída bit-perfect e DSD, controlo MIDI e remoto."
pitch = "Emissão de rádio para Linux, Windows e macOS. Leitores independentes, misturas sobrepostas com precisão de amostra, uma saída de pré-escuta separada e um motor de áudio que a interface nunca consegue bloquear."
