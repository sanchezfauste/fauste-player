[privacy]
title = "Política de privacidade — Fauste Player"
description = "O Fauste Player não recolhe dados pessoais, não envia telemetria e não abre ligações de rede por iniciativa própria."
heading = "Política de privacidade"
updated = "Última atualização: 24 de outubro de 2026. Esta política abrange a aplicação de secretária Fauste Player em todas as distribuições: Microsoft Store, Snap Store, os pacotes da página de versões no GitHub e as compilações a partir do código-fonte."
no-data-heading = "Não são recolhidos dados"
no-data = "O Fauste Player não recolhe dados pessoais. Não tem contas, análises, publicidade nem telemetria, e nunca envia nada sobre si, o seu computador ou a sua música ao autor nem a mais ninguém."
local-heading = "O que fica no seu computador"
local-before = "Para funcionar, a aplicação guarda estes ficheiros nas suas próprias pastas no seu computador (consulte"
local-link = "Dados e cópias de segurança"
local-after = "no guia do utilizador para saber onde estão):"
local-settings = "as suas definições, listas, páginas de cartuchos e sessão;"
local-cache = "uma cache de análise com as etiquetas, os marcadores, a sonoridade e a forma de onda dos ficheiros de áudio que carrega;"
local-logs = "ficheiros de registo e relatórios de falhas, que podem conter caminhos de ficheiros e nomes de dispositivos."
local-leave = "Estes ficheiros nunca saem do seu computador, a menos que decida partilhá-los, por exemplo anexando um registo a um relatório de erro. Pode eliminá-los a qualquer momento; desinstalar a aplicação, ou eliminar as suas pastas, remove-os."
network-heading = "Rede"
network = "A aplicação não abre ligações de rede de saída por iniciativa própria. O controlo remoto opcional (uma API HTTP/JSON e OSC) está desativado por omissão. Quando o ativa nas Definições, aguarda ligações dos clientes que permitir: responde-lhes e envia atualizações em direto apenas aos clientes que as pedem. Pode ser protegido com um token e listas de origens permitidas. As ligações na aplicação, como o guia do utilizador ou a licença, abrem no seu navegador web, aplicando-se então a política de privacidade deste."
stores-heading = "Distribuição em lojas"
stores = "As lojas que distribuem o Fauste Player (por exemplo a Microsoft Store ou a Snap Store) podem recolher dados sobre transferências, instalações e falhas segundo as suas próprias políticas de privacidade. O autor não tem controlo sobre esses dados."
changes-heading = "Alterações e contacto"
changes = "Se esta política mudar, a nova versão é publicada nesta página com uma nova data. As perguntas podem ser feitas no <a href=\"https://github.com/sanchezfauste/fauste-player/issues\">gestor de problemas</a> ou escrevendo ao autor, Marc Sánchez Fauste, através de <a href=\"https://sanchezfauste.com/\">sanchezfauste.com</a>."
