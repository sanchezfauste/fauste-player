# cargo-nextest runs every test of every binary at once, each in its own
# process. CI uses the `ci` profile (see docs/technical/testing.md); locally,
# `cargo nextest run --workspace` is a faster `cargo test --workspace`.

[profile.default]
# A test that runs for a minute is reported as slow; one still running after
# ten minutes is killed and named, instead of hanging the run.
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci]
# Every failure is reported, as `--no-fail-fast` did; no retries, so a flaky
# test fails where it can be seen.
fail-fast = false
failure-output = "immediate-final"
