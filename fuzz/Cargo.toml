doc = false
bench = false

[[bin]]
name = "pls"
path = "fuzz_targets/pls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cart_page"
path = "fuzz_targets/cart_page.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_documents"
path = "fuzz_targets/store_documents.rs"
test = false
doc = false
bench = false
