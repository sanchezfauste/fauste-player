[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fp-model = { path = "../crates/fp-model" }
fp-store = { path = "../crates/fp-store" }

[[bin]]
name = "m3u"
path = "fuzz_targets/m3u.rs"
